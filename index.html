  function renderApp() {
    destroyCharts();
    const root = document.getElementById('bacc-app-root');
    if (!root) return;

    const lockCheck = global.BaccDB.checkStudentSubscriptionLock();
    if (lockCheck && lockCheck.isLocked) {
      root.innerHTML =
        renderNavbar() +
        `<main class="min-h-[75vh] flex items-center justify-center p-4">
          <div class="max-w-lg w-full bg-white rounded-3xl p-8 border-2 border-red-400 shadow-2xl text-center space-y-4">
            <div class="w-16 h-16 rounded-2xl bg-red-100 text-red-700 flex items-center justify-center text-3xl mx-auto">⛔</div>
            <span class="inline-block bg-red-100 text-red-900 text-xs font-extrabold px-3 py-1 rounded-full">انتهت صلاحية الاشتراك</span>
            <h1 class="text-2xl font-black text-slate-900">توقفت المنصة لانتهاء مدة اشتراكك المحددة</h1>
            <p class="text-xs sm:text-sm text-slate-600 leading-relaxed">
              عزيزي الطالب <strong>${escapeHtml(lockCheck.user.full_name)}</strong>، لقد انتهت الفترة الزمنية المحددة لاشتراكك في المنصة. لتجديد الاشتراك وإعادة تفعيل حسابك فوراً، يرجى التواصل مباشرة مع م. معاذ العقلي عبر واتساب (<strong>${escapeHtml(lockCheck.whatsappHandle)}</strong>).
            </p>
            <div class="pt-2 flex flex-col sm:flex-row justify-center gap-3">
              <button type="button" onclick="BaccApp.completeSubscriptionCheckout()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-black px-6 py-3 rounded-xl text-xs shadow-lg">
                📲 تواصل مع الإدارة لتجديد الاشتراك (${escapeHtml(lockCheck.whatsappHandle)})
              </button>
              <button type="button" onclick="BaccApp.logout()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold px-4 py-3 rounded-xl text-xs">
                تسجيل الخروج
              </button>
            </div>
          </div>
        </main>` +
        renderFooter() +
        renderModals();
      return;
    }

    let mainViewHtml = '';
    if (AppState.currentView === 'home') {
      mainViewHtml = renderHomeView();
    } else if (AppState.currentView === 'stage') {
      mainViewHtml = renderStageView();
    } else if (AppState.currentView === 'subject') {
      mainViewHtml = renderSubjectView();
    } else if (AppState.currentView === 'exams') {
      mainViewHtml = renderExamsHubView();
    } else if (AppState.currentView === 'exam_runner') {
      mainViewHtml = renderExamRunnerView();
    } else if (AppState.currentView === 'pricing') {
      mainViewHtml = renderPricingView();
    } else if (AppState.currentView === 'news') {
      mainViewHtml = renderNewsView();
    } else if (AppState.currentView === 'student_dashboard') {
      mainViewHtml = renderStudentDashboardView();
    } else if (AppState.currentView === 'admin_dashboard') {
      mainViewHtml = renderAdminDashboardView();
    } else if (AppState.currentView === 'courses') {
      mainViewHtml = renderCoursesView();
    } else if (AppState.currentView === 'teacher_dashboard') {
      mainViewHtml = renderTeacherDashboardView();
    } else if (AppState.currentView === 'profile_page') {
      mainViewHtml = renderProfilePageView();
    } else if (AppState.currentView === 'logout_page') {
      mainViewHtml = renderLogoutPageView();
    } else {
      mainViewHtml = renderHomeView();
    }

    root.innerHTML = renderNavbar() + '<main class="min-h-[75vh]">' + mainViewHtml + '</main>' + renderFooter() + renderModals();

    if (AppState.currentView === 'home') {
      global.BaccApp.recalculateBaccalaureateScore();
    }
    if (AppState.currentView === 'admin_dashboard' && AppState.adminTab === 'overview') {
      initAdminCharts();
    }
  }

  function initAdminCharts() {
    if (typeof global.Chart === 'undefined') return;
    let adminData;
    try {
      adminData = global.BaccDB.adminGetCompleteDashboard();
    } catch (e) {
      return;
    }

    const trackCtx = document.getElementById('adminTrackChart');
    if (trackCtx) {
      AppState.chartInstances.track = new global.Chart(trackCtx, {
        type: 'doughnut',
        data: {
          labels: adminData.trackDistribution.map(t => t.name),
          datasets: [
            {
              data: adminData.trackDistribution.map(t => Math.max(1, t.count)),
              backgroundColor: ['#0f766e', '#059669', '#1d4ed8', '#d97706', '#7e22ce']
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { position: 'bottom', labels: { font: { family: 'Cairo', size: 11 } } }
          }
        }
      });
    }

    const revCtx = document.getElementById('adminRevenueChart');
    if (revCtx) {
      AppState.chartInstances.rev = new global.Chart(revCtx, {
        type: 'bar',
        data: {
          labels: ['سبتمبر', 'أكتوبر', 'نوفمبر (الحالي)', 'مستهدف ديسمبر'],
          datasets: [
            {
              label: 'إيرادات الاشتراكات (ج.م)',
              data: [420, 800, adminData.stats.total_revenue_egp, adminData.stats.total_revenue_egp + 950],
              backgroundColor: '#0f766e',
              borderRadius: 8
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { labels: { font: { family: 'Cairo', size: 11 } } }
          }
        }
      });
    }
  }

  global.BaccApp = {

    downloadSingleIndexHtml() {
      try {
        const fullHtml = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
        const blob = new Blob([fullHtml], { type: 'text/html;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'index.html';
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
        showToast('تم تحميل المنصة بالكامل في ملف واحد (index.html) جاهز للرفع المباشر!', 'success');
      } catch (e) {
        showToast(e.message, 'error');
      }
    },

    downloadEmbeddedSqlSchema() {
      try {
        const sqlText = "-- ============================================================================\n-- Baccalaureate Academy - المصرية للبكالوريا (Phases 1, 2, 3, & 4)\n-- Complete Normalized Supabase PostgreSQL Schema, Foreign Keys, Storage & RLS\n-- ملاحظة: البيانات الأولية المرفقة هي بيانات تجريبية اختبارية وليست محتوى رسميًا\n-- ============================================================================\n\nCREATE EXTENSION IF NOT EXISTS \"pgcrypto\";\n\n-- ============================================================================\n-- 1. جدول المراحل الدراسية (Stages)\n-- ============================================================================\nCREATE TABLE IF NOT EXISTS public.stages (\n    id TEXT PRIMARY KEY,\n    name TEXT NOT NULL,\n    subtitle TEXT NOT NULL,\n    description TEXT NOT NULL,\n    system_type TEXT NOT NULL,\n    max_score INTEGER NOT NULL DEFAULT 600,\n    order_index INTEGER NOT NULL UNIQUE\n);\n\n-- ============================================================================\n-- 2. جدول المسارات التخصصية (Tracks)\n-- ============================================================================\nCREATE TABLE IF NOT EXISTS public.tracks (\n    id TEXT PRIMARY KEY,\n    name TEXT NOT NULL,\n    equivalent_to TEXT NOT NULL,\n    description TEXT NOT NULL,\n    g2_elective_rule TEXT NOT NULL,\n    g3_core_subjects TEXT NOT NULL,\n    target_colleges TEXT NOT NULL\n);\n\n-- ============================================================================\n-- 3. جدول المستخدمين الموحد (Users: الطالب / المدرس / المدير)\n-- مرتبط بـ Supabase Authentication (auth.users)\n-- ============================================================================\nCREATE TABLE IF NOT EXISTS public.users (\n    id UUID PRIMARY KEY REFERENCES auth.users(id) ON DELETE CASCADE,\n    email TEXT UNIQUE NOT NULL,\n    full_name TEXT NOT NULL,\n    avatar_url TEXT DEFAULT '',\n    role TEXT NOT NULL DEFAULT 'student' CHECK (role IN ('student', 'teacher', 'admin')),\n    permissions TEXT[] NOT NULL DEFAULT ARRAY['read:own_stage'],\n    stage_id TEXT REFERENCES public.stages(id) ON DELETE SET NULL,\n    track_id TEXT REFERENCES public.tracks(id) ON DELETE SET NULL,\n    specialty TEXT DEFAULT '',\n    assigned_subject_ids TEXT[] NOT NULL DEFAULT '{}',\n    approval_status TEXT NOT NULL DEFAULT 'approved' CHECK (approval_status IN ('approved', 'pending_review', 'rejected')),\n    status TEXT NOT NULL DEFAULT 'active' CHECK (status IN ('active', 'suspended')),\n    phone TEXT DEFAULT '',\n    governorate TEXT DEFAULT 'الشرقية',\n    subscription_plan TEXT DEFAULT 'plan_free',\n    created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),\n    updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW()\n);\n\n-- ============================================================================\n-- 4. جدول المواد الدراسية (Subjects)\n-- ============================================================================\nCREATE TABLE IF NOT EXISTS public.subjects (\n    id TEXT PRIMARY KEY,\n    stage_id TEXT NOT NULL REFERENCES public.stages(id) ON DELETE CASCADE,\n    track_ids TEXT[] NOT NULL DEFAULT '{}',\n    name TEXT NOT NULL,\n    category TEXT NOT NULL CHECK (category IN ('أساسية للمجموع', 'تخصصية للمسار', 'مستوى رفيع متقدم', 'نجاح ورسوب (خارج المجموع)')),\n    description TEXT NOT NULL,\n    image_url TEXT DEFAULT '',\n    teacher_id UUID REFERENCES public.users(id) ON DELETE SET NULL,\n    max_grade INTEGER NOT NULL DEFAULT 100,\n    pass_grade INTEGER NOT NULL DEFAULT 50,\n    price_egp NUMERIC(10,2) NOT NULL DEFAULT 0,\n    is_premium BOOLEAN NOT NULL DEFAULT FALSE,\n    is_published BOOLEAN NOT NULL DEFAULT TRUE,\n    is_demo_data BOOLEAN NOT NULL DEFAULT TRUE,\n    created_at TIMESTAMPTZ NOT NULL DEFAULT NOW()\n);\n\n-- ============================================================================\n-- 5. جدول الكورسات التعليمية (Courses - المرحلة الرابعة)\n-- ============================================================================\nCREATE TABLE IF NOT EXISTS public.courses (\n    id TEXT PRIMARY KEY,\n    title TEXT NOT NULL,\n    subject_id TEXT NOT NULL REFERENCES public.subjects(id) ON DELETE CASCADE,\n    stage_id TEXT NOT NULL REFERENCES public.stages(id) ON DELETE CASCADE,\n    teacher_id UUID REFERENCES public.users(id) ON DELETE SET NULL,\n    image_url TEXT DEFAULT '',\n    description TEXT NOT NULL,\n    duration_hours NUMERIC(5,1) NOT NULL DEFAULT 12.0,\n    is_premium BOOLEAN NOT NULL DEFAULT FALSE,\n    price_egp NUMERIC(10,2) NOT NULL DEFAULT 0,\n    is_published BOOLEAN NOT NULL DEFAULT TRUE,\n    review_status TEXT NOT NULL DEFAULT 'approved' CHECK (review_status IN ('approved', 'pending', 'rejected', 'hidden')),\n    created_at TIMESTAMPTZ NOT NULL DEFAULT NOW()\n);\n\n-- ============================================================================\n-- 6. جدول تسجيل الطلاب في الكورسات (Course_Enrollments)\n-- ============================================================================\nCREATE TABLE IF NOT EXISTS public.course_enrollments (\n    id UUID PRIMARY KEY DEFAULT gen_random_uuid(),\n    student_id UUID NOT NULL REFERENCES public.users(id) ON DELETE CASCADE,\n    course_id TEXT NOT NULL REFERENCES public.courses(id) ON DELETE CASCADE,\n    last_lesson_id TEXT,\n    enrolled_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),\n    UNIQUE(student_id, course_id)\n);\n\n-- ============================================================================\n-- 7. جدول الوحدات التعليمية (Units)\n-- ============================================================================\nCREATE TABLE IF NOT EXISTS public.units (\n    id TEXT PRIMARY KEY,\n    subject_id TEXT NOT NULL REFERENCES public.subjects(id) ON DELETE CASCADE,\n    course_id TEXT REFERENCES public.courses(id) ON DELETE CASCADE,\n    title TEXT NOT NULL,\n    order_index INTEGER NOT NULL DEFAULT 1\n);\n\n-- ============================================================================\n-- 8. جدول الدروس (Lessons)\n-- ============================================================================\nCREATE TABLE IF NOT EXISTS public.lessons (\n    id TEXT PRIMARY KEY,\n    unit_id TEXT NOT NULL REFERENCES public.units(id) ON DELETE CASCADE,\n    subject_id TEXT NOT NULL REFERENCES public.subjects(id) ON DELETE CASCADE,\n    course_id TEXT REFERENCES public.courses(id) ON DELETE CASCADE,\n    title TEXT NOT NULL,\n    content TEXT NOT NULL DEFAULT '',\n    video_url TEXT NOT NULL,\n    video_summary TEXT NOT NULL,\n    pdf_title TEXT NOT NULL,\n    pdf_content TEXT NOT NULL,\n    duration_minutes INTEGER NOT NULL DEFAULT 45,\n    order_index INTEGER NOT NULL DEFAULT 1,\n    is_free_preview BOOLEAN NOT NULL DEFAULT FALSE,\n    is_published BOOLEAN NOT NULL DEFAULT TRUE,\n    review_status TEXT NOT NULL DEFAULT 'approved' CHECK (review_status IN ('approved', 'pending', 'rejected', 'hidden')),\n    quiz_questions JSONB NOT NULL DEFAULT '[]'::jsonb,\n    created_by UUID REFERENCES public.users(id) ON DELETE SET NULL,\n    created_at TIMESTAMPTZ NOT NULL DEFAULT NOW()\n);\n\n-- ============================================================================\n-- 9. جدول مرفقات الدروس والتخزين السحابي (Lesson_Attachments - Supabase Storage)\n-- ============================================================================\nCREATE TABLE IF NOT EXISTS public.lesson_attachments (\n    id TEXT PRIMARY KEY,\n    lesson_id TEXT NOT NULL REFERENCES public.lessons(id) ON DELETE CASCADE,\n    course_id TEXT REFERENCES public.courses(id) ON DELETE CASCADE,\n    stage_id TEXT NOT NULL REFERENCES public.stages(id) ON DELETE CASCADE,\n    subject_id TEXT NOT NULL REFERENCES public.subjects(id) ON DELETE CASCADE,\n    file_name TEXT NOT NULL,\n    file_type TEXT NOT NULL CHECK (file_type IN ('application/pdf', 'image/png', 'image/jpeg', 'video/external-link')),\n    storage_bucket TEXT NOT NULL DEFAULT 'course-materials',\n    storage_path TEXT NOT NULL,\n    is_protected BOOLEAN NOT NULL DEFAULT FALSE,\n    uploaded_by UUID REFERENCES public.users(id) ON DELETE SET NULL,\n    created_at TIMESTAMPTZ NOT NULL DEFAULT NOW()\n);\n\n-- ============================================================================\n-- 10. جدول مراجعة واعتماد المحتوى (Content_Reviews)\n-- ============================================================================\nCREATE TABLE IF NOT EXISTS public.content_reviews (\n    id UUID PRIMARY KEY DEFAULT gen_random_uuid(),\n    target_type TEXT NOT NULL CHECK (target_type IN ('teacher', 'course', 'lesson')),\n    target_id TEXT NOT NULL,\n    reviewer_id UUID NOT NULL REFERENCES public.users(id) ON DELETE CASCADE,\n    decision TEXT NOT NULL CHECK (decision IN ('approved', 'rejected', 'hidden')),\n    notes TEXT DEFAULT '',\n    reviewed_at TIMESTAMPTZ NOT NULL DEFAULT NOW()\n);\n\n-- ============================================================================\n-- 11. جدول الامتحانات (Exams)\n-- ============================================================================\nCREATE TABLE IF NOT EXISTS public.exams (\n    id TEXT PRIMARY KEY,\n    title TEXT NOT NULL,\n    subject_id TEXT NOT NULL REFERENCES public.subjects(id) ON DELETE CASCADE,\n    course_id TEXT REFERENCES public.courses(id) ON DELETE SET NULL,\n    stage_id TEXT NOT NULL REFERENCES public.stages(id) ON DELETE CASCADE,\n    exam_type TEXT NOT NULL DEFAULT 'امتحان مادة',\n    duration_minutes INTEGER NOT NULL DEFAULT 45,\n    total_marks INTEGER NOT NULL DEFAULT 100,\n    pass_marks INTEGER NOT NULL DEFAULT 50,\n    is_premium BOOLEAN NOT NULL DEFAULT FALSE,\n    published_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),\n    created_by UUID REFERENCES public.users(id) ON DELETE SET NULL\n);\n\n-- ============================================================================\n-- 12. جدول الأسئلة المستقل (Questions - مرتبط بـ Exams بمفتاح خارجي)\n-- ============================================================================\nCREATE TABLE IF NOT EXISTS public.questions (\n    id TEXT PRIMARY KEY,\n    exam_id TEXT NOT NULL REFERENCES public.exams(id) ON DELETE CASCADE,\n    question_text TEXT NOT NULL,\n    question_type TEXT NOT NULL DEFAULT 'mcq' CHECK (question_type IN ('mcq', 'tf', 'short')),\n    options JSONB NOT NULL DEFAULT '[]'::jsonb,\n    correct_answer TEXT NOT NULL,\n    marks NUMERIC(5,2) NOT NULL DEFAULT 20,\n    explanation TEXT DEFAULT '',\n    order_index INTEGER NOT NULL DEFAULT 1\n);\n\n-- ============================================================================\n-- 13. جدول نتائج الطلاب (Results - يُمنع تعديل الدرجات مباشرة بعد الرصد)\n-- ============================================================================\nCREATE TABLE IF NOT EXISTS public.results (\n    id UUID PRIMARY KEY DEFAULT gen_random_uuid(),\n    student_id UUID NOT NULL REFERENCES public.users(id) ON DELETE CASCADE,\n    exam_id TEXT NOT NULL REFERENCES public.exams(id) ON DELETE CASCADE,\n    subject_id TEXT NOT NULL REFERENCES public.subjects(id) ON DELETE CASCADE,\n    score NUMERIC(6,2) NOT NULL,\n    total_marks NUMERIC(6,2) NOT NULL DEFAULT 100,\n    percentage NUMERIC(5,2) NOT NULL,\n    attempt_number INTEGER NOT NULL DEFAULT 1,\n    opportunity_label TEXT NOT NULL DEFAULT 'الفرصة الأولى الأساسية',\n    answers JSONB NOT NULL DEFAULT '{}'::jsonb,\n    attempted_at TIMESTAMPTZ NOT NULL DEFAULT NOW()\n);\n\n-- ============================================================================\n-- 14. جدول تقدم الطلاب (Progress - حفظ حالة الإنجاز ونقطة التوقف)\n-- ============================================================================\nCREATE TABLE IF NOT EXISTS public.progress (\n    id UUID PRIMARY KEY DEFAULT gen_random_uuid(),\n    student_id UUID NOT NULL REFERENCES public.users(id) ON DELETE CASCADE,\n    lesson_id TEXT NOT NULL REFERENCES public.lessons(id) ON DELETE CASCADE,\n    course_id TEXT REFERENCES public.courses(id) ON DELETE CASCADE,\n    subject_id TEXT NOT NULL REFERENCES public.subjects(id) ON DELETE CASCADE,\n    completed BOOLEAN NOT NULL DEFAULT FALSE,\n    progress_percent NUMERIC(5,2) NOT NULL DEFAULT 0,\n    last_position_seconds INTEGER NOT NULL DEFAULT 0,\n    quiz_score NUMERIC(5,2),\n    notes TEXT DEFAULT '',\n    updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),\n    UNIQUE(student_id, lesson_id)\n);\n\n-- ============================================================================\n-- 15. جدول الاشتراكات والباقات (Subscription_Plans & Subscriptions)\n-- ============================================================================\nCREATE TABLE IF NOT EXISTS public.subscription_plans (\n    id TEXT PRIMARY KEY,\n    name TEXT NOT NULL,\n    price_egp NUMERIC(10,2) NOT NULL,\n    billing_cycle TEXT NOT NULL,\n    badge TEXT,\n    features TEXT[] NOT NULL DEFAULT '{}',\n    unlocks_all_stage BOOLEAN NOT NULL DEFAULT FALSE\n);\n\nCREATE TABLE IF NOT EXISTS public.subscriptions (\n    id UUID PRIMARY KEY DEFAULT gen_random_uuid(),\n    student_id UUID NOT NULL REFERENCES public.users(id) ON DELETE CASCADE,\n    plan_id TEXT REFERENCES public.subscription_plans(id) ON DELETE SET NULL,\n    course_id TEXT REFERENCES public.courses(id) ON DELETE SET NULL,\n    subject_id TEXT REFERENCES public.subjects(id) ON DELETE SET NULL,\n    amount_egp NUMERIC(10,2) NOT NULL DEFAULT 0,\n    payment_method TEXT NOT NULL,\n    transaction_ref TEXT NOT NULL,\n    status TEXT NOT NULL DEFAULT 'active' CHECK (status IN ('active', 'expired', 'pending', 'cancelled')),\n    started_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),\n    expires_at TIMESTAMPTZ\n);\n\n-- ============================================================================\n-- 16. جدول الإعلانات والإشعارات (Announcements & Notifications)\n-- ============================================================================\nCREATE TABLE IF NOT EXISTS public.announcements (\n    id TEXT PRIMARY KEY,\n    title TEXT NOT NULL,\n    category TEXT NOT NULL DEFAULT 'أخبار وإعلانات',\n    content TEXT NOT NULL,\n    official_source_label TEXT DEFAULT 'إدارة Baccalaureate Academy',\n    published_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),\n    is_pinned BOOLEAN NOT NULL DEFAULT FALSE\n);\n\nCREATE TABLE IF NOT EXISTS public.notifications (\n    id TEXT PRIMARY KEY,\n    target_role TEXT NOT NULL DEFAULT 'all',\n    target_stage TEXT DEFAULT 'all',\n    title TEXT NOT NULL,\n    message TEXT NOT NULL,\n    type TEXT NOT NULL DEFAULT 'info',\n    created_at TIMESTAMPTZ NOT NULL DEFAULT NOW()\n);\n\n-- ============================================================================\n-- 17. دوال التحقق من الصلاحيات على مستوى الخادم وقاعدة البيانات (RBAC Functions)\n-- ============================================================================\nCREATE OR REPLACE FUNCTION public.is_admin()\nRETURNS BOOLEAN\nLANGUAGE sql\nSECURITY DEFINER\nSET search_path = public\nAS $$\n  SELECT EXISTS (\n    SELECT 1 FROM public.users\n    WHERE id = auth.uid() AND role = 'admin' AND status = 'active'\n  );\n$$;\n\nCREATE OR REPLACE FUNCTION public.is_approved_teacher()\nRETURNS BOOLEAN\nLANGUAGE sql\nSECURITY DEFINER\nSET search_path = public\nAS $$\n  SELECT EXISTS (\n    SELECT 1 FROM public.users\n    WHERE id = auth.uid()\n      AND role = 'teacher'\n      AND status = 'active'\n      AND approval_status = 'approved'\n  );\n$$;\n\nCREATE OR REPLACE FUNCTION public.current_student_stage()\nRETURNS TEXT\nLANGUAGE sql\nSECURITY DEFINER\nSET search_path = public\nAS $$\n  SELECT stage_id FROM public.users WHERE id = auth.uid();\n$$;\n\n-- ============================================================================\n-- 18. تفعيل سياسات Row Level Security (RLS) على جميع الجداول\n-- ============================================================================\nALTER TABLE public.stages ENABLE ROW LEVEL SECURITY;\nALTER TABLE public.tracks ENABLE ROW LEVEL SECURITY;\nALTER TABLE public.users ENABLE ROW LEVEL SECURITY;\nALTER TABLE public.subjects ENABLE ROW LEVEL SECURITY;\nALTER TABLE public.courses ENABLE ROW LEVEL SECURITY;\nALTER TABLE public.course_enrollments ENABLE ROW LEVEL SECURITY;\nALTER TABLE public.units ENABLE ROW LEVEL SECURITY;\nALTER TABLE public.lessons ENABLE ROW LEVEL SECURITY;\nALTER TABLE public.lesson_attachments ENABLE ROW LEVEL SECURITY;\nALTER TABLE public.content_reviews ENABLE ROW LEVEL SECURITY;\nALTER TABLE public.exams ENABLE ROW LEVEL SECURITY;\nALTER TABLE public.questions ENABLE ROW LEVEL SECURITY;\nALTER TABLE public.results ENABLE ROW LEVEL SECURITY;\nALTER TABLE public.progress ENABLE ROW LEVEL SECURITY;\nALTER TABLE public.subscription_plans ENABLE ROW LEVEL SECURITY;\nALTER TABLE public.subscriptions ENABLE ROW LEVEL SECURITY;\nALTER TABLE public.announcements ENABLE ROW LEVEL SECURITY;\nALTER TABLE public.notifications ENABLE ROW LEVEL SECURITY;\n\n-- سياسات Users: الطالب والمدرس يشاهدان ويعدلان ملفهما الشخصي فقط (بدون تغيير الدور role أو حالة الاعتماد)، والمدير يدير الجميع\nCREATE POLICY \"Users select own or admin\" ON public.users\n  FOR SELECT USING (auth.uid() = id OR role = 'teacher' OR public.is_admin());\n\nCREATE POLICY \"Users update own profile safely\" ON public.users\n  FOR UPDATE USING (auth.uid() = id OR public.is_admin())\n  WITH CHECK (\n    public.is_admin() OR (\n      auth.uid() = id\n      AND role = (SELECT u.role FROM public.users u WHERE u.id = auth.uid())\n      AND approval_status = (SELECT u.approval_status FROM public.users u WHERE u.id = auth.uid())\n    )\n  );\n\nCREATE POLICY \"Admin full manage users\" ON public.users\n  FOR ALL USING (public.is_admin());\n\n-- سياسات المراحل والمسارات\nCREATE POLICY \"Public read stages\" ON public.stages FOR SELECT USING (true);\nCREATE POLICY \"Admin write stages\" ON public.stages FOR ALL USING (public.is_admin());\n\nCREATE POLICY \"Public read tracks\" ON public.tracks FOR SELECT USING (true);\nCREATE POLICY \"Admin write tracks\" ON public.tracks FOR ALL USING (public.is_admin());\n\n-- سياسات المواد والكورسات: الطالب يرى المحتوى المنشور والخاص بمرحلته، والمدرس المعتمد يدير مواده، والمدير يدير الكل\nCREATE POLICY \"Select published subjects for stage\" ON public.subjects\n  FOR SELECT USING (\n    public.is_admin()\n    OR (is_published = true AND (auth.uid() IS NULL OR stage_id = public.current_student_stage() OR public.is_approved_teacher()))\n  );\n\nCREATE POLICY \"Admin manage subjects\" ON public.subjects\n  FOR ALL USING (public.is_admin());\n\nCREATE POLICY \"Select approved courses for stage\" ON public.courses\n  FOR SELECT USING (\n    public.is_admin()\n    OR teacher_id = auth.uid()\n    OR (is_published = true AND review_status = 'approved' AND (auth.uid() IS NULL OR stage_id = public.current_student_stage()))\n  );\n\nCREATE POLICY \"Approved teacher manage own courses\" ON public.courses\n  FOR INSERT WITH CHECK (public.is_admin() OR (public.is_approved_teacher() AND teacher_id = auth.uid()));\n\nCREATE POLICY \"Approved teacher update own courses\" ON public.courses\n  FOR UPDATE USING (public.is_admin() OR (public.is_approved_teacher() AND teacher_id = auth.uid()));\n\nCREATE POLICY \"Admin delete courses\" ON public.courses\n  FOR DELETE USING (public.is_admin());\n\n-- سياسات الدروس والمرفقات\nCREATE POLICY \"Select approved lessons\" ON public.lessons\n  FOR SELECT USING (\n    public.is_admin()\n    OR created_by = auth.uid()\n    OR (is_published = true AND review_status = 'approved')\n  );\n\nCREATE POLICY \"Approved teacher insert lessons\" ON public.lessons\n  FOR INSERT WITH CHECK (public.is_admin() OR (public.is_approved_teacher() AND created_by = auth.uid()));\n\nCREATE POLICY \"Approved teacher update own lessons\" ON public.lessons\n  FOR UPDATE USING (public.is_admin() OR (public.is_approved_teacher() AND created_by = auth.uid()));\n\nCREATE POLICY \"Admin delete lessons\" ON public.lessons\n  FOR DELETE USING (public.is_admin());\n\n-- سياسات نتائج الطلاب (Results): لا يستطيع أي مستخدم تعديل أو حذف النتائج مباشرة!\nCREATE POLICY \"Student view own results or teacher/admin view\" ON public.results\n  FOR SELECT USING (\n    auth.uid() = student_id\n    OR public.is_admin()\n    OR (public.is_approved_teacher() AND EXISTS (\n      SELECT 1 FROM public.subjects s WHERE s.id = results.subject_id AND s.teacher_id = auth.uid()\n    ))\n  );\n\nCREATE POLICY \"Student insert own result via grading engine\" ON public.results\n  FOR INSERT WITH CHECK (auth.uid() = student_id);\n\n-- منع التعديل المباشر لدرجات الطلاب (No UPDATE policy for students/teachers on results)\nCREATE POLICY \"Only system admin audit results\" ON public.results\n  FOR DELETE USING (public.is_admin());\n\n-- سياسات تقدم الطلاب (Progress): كل طالب يقرأ ويحدث تقدمه الشخصي فقط، ويُمنع تماماً تعديل تقدم طالب آخر\nCREATE POLICY \"Student select own progress\" ON public.progress\n  FOR SELECT USING (auth.uid() = student_id OR public.is_admin() OR public.is_approved_teacher());\n\nCREATE POLICY \"Student insert own progress\" ON public.progress\n  FOR INSERT WITH CHECK (auth.uid() = student_id);\n\nCREATE POLICY \"Student update own progress only\" ON public.progress\n  FOR UPDATE USING (auth.uid() = student_id) WITH CHECK (auth.uid() = student_id);\n\n-- سياسات المراجعات والاشتراكات والإعلانات\nCREATE POLICY \"Admin manage content reviews\" ON public.content_reviews FOR ALL USING (public.is_admin());\nCREATE POLICY \"Student own enrollments\" ON public.course_enrollments FOR ALL USING (auth.uid() = student_id OR public.is_admin());\nCREATE POLICY \"Student own subscriptions\" ON public.subscriptions FOR SELECT USING (auth.uid() = student_id OR public.is_admin());\nCREATE POLICY \"Public read announcements\" ON public.announcements FOR SELECT USING (true);\nCREATE POLICY \"Admin write announcements\" ON public.announcements FOR ALL USING (public.is_admin());\n";
        const blob = new Blob([sqlText], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'schema.sql';
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
        showToast('تم استخراج وتحميل ملف قاعدة البيانات (schema.sql) من داخل الملف الموحد!', 'success');
      } catch (e) {
        showToast(e.message, 'error');
      }
    },
    init() {
      renderApp();
    },

    navigate(viewName) {
      clearTimers();
      if (viewName !== 'exam_runner') clearExamTimer();
      AppState.currentView = viewName;
      AppState.notifOpen = false;
      AppState.searchOpen = false;
      renderApp();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    },

    scrollToSection(secId) {
      const el = document.getElementById(secId);
      if (el) el.scrollIntoView({ behavior: 'smooth' });
    },

    openStage(stageId) {
      clearTimers();
      AppState.selectedStageId = stageId;
      AppState.selectedTrackFilter = 'all';
      AppState.currentView = 'stage';
      renderApp();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    },

    openStageWithTrack(stageId, trackId) {
      clearTimers();
      AppState.selectedStageId = stageId;
      AppState.selectedTrackFilter = trackId;
      AppState.currentView = 'stage';
      renderApp();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    },

    setTrackFilter(trackId) {
      AppState.selectedTrackFilter = trackId;
      renderApp();
    },

    openSubject(subjectId) {
      clearTimers();
      AppState.selectedSubjectId = subjectId;
      const details = global.BaccDB.getSubjectDetails(subjectId);
      AppState.selectedLessonId = details && details.all_lessons.length ? details.all_lessons[0].id : null;
      AppState.lessonTab = 'video';
      AppState.quizAnswers = {};
      AppState.quizSubmitted = false;
      AppState.studioSeconds = 0;
      AppState.currentView = 'subject';
      renderApp();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    },

    selectLesson(lessonId) {
      clearTimers();
      AppState.selectedLessonId = lessonId;
      AppState.quizAnswers = {};
      AppState.quizSubmitted = false;
      AppState.studioSeconds = 0;
      renderApp();
    },

    setLessonTab(tabName) {
      clearTimers();
      AppState.lessonTab = tabName;
      renderApp();
    },

    setVideoMode(mode) {
      clearTimers();
      AppState.videoMode = mode;
      renderApp();
    },

    toggleStudioPlay(maxSeconds) {
      if (AppState.studioPlaying) {
        clearTimers();
        renderApp();
        return;
      }
      AppState.studioPlaying = true;
      playAcademySound('start');
      renderApp();
      this.speakCurrentSlideNow();
      AppState.studioInterval = setInterval(() => {
        AppState.studioSeconds += AppState.studioSpeed;
        if (AppState.studioSeconds >= maxSeconds) {
          AppState.studioSeconds = maxSeconds;
          clearTimers();
          renderApp();
          showToast('اكتمل تشغيل شرح الدرس! يمكنك الآن حل التدريب التفاعلي.', 'success');
          return;
        }
        const lbl = document.getElementById('studio-time-label');
        if (lbl) lbl.textContent = formatSeconds(AppState.studioSeconds) + ' / ' + formatSeconds(maxSeconds);
      }, 1000);
    },

    setStudioSlide(idx) {
      AppState.studioSlideIdx = Number(idx || 0);
      playAcademySound('slide');
      renderApp();
      if (AppState.studioPlaying) {
        this.speakCurrentSlideNow();
      }
    },

    toggleStudioMute() {
      AppState.studioMuted = !AppState.studioMuted;
      if (AppState.studioMuted) {
        stopArabicSpeech();
      } else {
        playAcademySound('start');
        if (AppState.studioPlaying) this.speakCurrentSlideNow();
      }
      renderApp();
    },

    speakCurrentSlideNow() {
      const details = global.BaccDB.getSubjectDetails(AppState.selectedSubjectId);
      const les = details ? details.all_lessons.find(l => l.id === AppState.selectedLessonId) : null;
      if (!les) return;
      playAcademySound('slide');
      const txt =
        AppState.studioSlideIdx === 0
          ? les.title + '. ' + les.video_summary
          : AppState.studioSlideIdx === 1
          ? les.pdf_content
          : 'خلاصة الدرس وأهم نقاط الامتحان: ' + les.video_summary;
      speakArabicLecture(txt);
    },

    seekStudioVideo(val) {
      AppState.studioSeconds = Number(val || 0);
      try {
        if (global.BaccDB.getCurrentUser() && AppState.selectedLessonId) {
          global.BaccDB.saveStudentLessonProgress({
            lessonId: AppState.selectedLessonId,
            lastPositionSeconds: AppState.studioSeconds
          });
        }
      } catch (e) {}
      renderApp();
    },

    changeStudioSpeed() {
      const speeds = [1, 1.25, 1.5, 2];
      const idx = speeds.indexOf(AppState.studioSpeed);
      AppState.studioSpeed = speeds[(idx + 1) % speeds.length];
      renderApp();
    },

    toggleLessonCompleteBtn(lessonId) {
      try {
        const prog = global.BaccDB.toggleLessonCompleted(lessonId);
        showToast(prog.completed ? 'تم تسجيل الدرس كمكتمل وتحديث نسبة تقدمك ✓' : 'تمت إعادة الدرس إلى قائمة قيد الدراسة', 'success');
        renderApp();
      } catch (e) {
        if (e.message.includes('RLS_AUTH_REQUIRED')) {
          showToast('يرجى تسجيل الدخول بحساب طالب أولاً لحفظ تقدمك الدراسي.', 'warning');
          this.openAuthModal('student_login');
        } else {
          showToast(e.message, 'error');
        }
      }
    },

    saveLessonNotes(lessonId) {
      const box = document.getElementById('student-lesson-notes');
      const notes = box ? box.value : '';
      try {
        global.BaccDB.toggleLessonCompleted(lessonId, notes);
        showToast('تم حفظ ملاحظاتك الشخصية على هذا الدرس بنجاح.', 'success');
      } catch (e) {
        showToast('يرجى تسجيل الدخول أولاً لحفظ الملاحظات.', 'warning');
        this.openAuthModal('student_login');
      }
    },

    downloadLessonPdf(lessonId) {
      const details = global.BaccDB.getSubjectDetails(AppState.selectedSubjectId);
      if (!details) return;
      const les = details.all_lessons.find(l => l.id === lessonId);
      if (!les || !les.can_view) return;
      const content =
        '============================================================\n' +
        'Baccalaureate Academy - أكاديمية البكالوريا المصرية\n' +
        'المادة: ' + details.name + '\n' +
        'الدرس: ' + les.title + '\n' +
        '============================================================\n\n' +
        les.pdf_content +
        '\n\n------------------------------------------------------------\n' +
        'ملخص المحاضرة:\n' +
        les.video_summary +
        '\n';
      const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = les.pdf_title.replace(/\.pdf$/i, '') + '.txt';
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      showToast('تم تنزيل مذكرة الدرس بنجاح.', 'success');
    },

    pickLessonQuizOption(qIdx, optIdx) {
      if (AppState.quizSubmitted) return;
      AppState.quizAnswers[qIdx] = optIdx;
      renderApp();
    },

    submitLessonQuiz(lessonId) {
      const details = global.BaccDB.getSubjectDetails(AppState.selectedSubjectId);
      const les = details ? details.all_lessons.find(l => l.id === lessonId) : null;
      if (!les) return;
      const questions = les.quiz_questions || [];
      let correctCount = 0;
      questions.forEach((q, idx) => {
        if (String(AppState.quizAnswers[idx]) === String(q.correct)) correctCount++;
      });
      const scorePct = questions.length > 0 ? Math.round((correctCount / questions.length) * 100) : 100;
      AppState.quizSubmitted = true;
      try {
        if (global.BaccDB.getCurrentUser()) {
          global.BaccDB.toggleLessonCompleted(lessonId, undefined, scorePct);
        }
      } catch (e) {
        // ignore if guest previewing free lesson
      }
      showToast('نتيجة تدريب الدرس: ' + scorePct + '% (' + correctCount + ' من ' + questions.length + ')', 'success');
      renderApp();
    },

    resetLessonQuiz() {
      AppState.quizAnswers = {};
      AppState.quizSubmitted = false;
      renderApp();
    },

    setExamStageFilter(val) {
      AppState.examStageFilter = val;
      AppState.examSubjectFilter = 'all';
      renderApp();
    },

    setExamSubjectFilter(val) {
      AppState.examSubjectFilter = val;
      renderApp();
    },

    startExam(examId, opportunityLabel) {
      const user = global.BaccDB.getCurrentUser();
      if (!user) {
        showToast('يرجى تسجيل الدخول بحساب طالب أولاً لبدء الاختبار وتسجيل درجتك في السجل.', 'warning');
        this.openAuthModal('student_login');
        return;
      }
      const exams = global.BaccDB.getExams();
      const ex = exams.find(e => e.id === examId);
      if (!ex) return;
      if (!ex.can_access) {
        showToast('هذا الاختبار يتطلب الاشتراك في المادة أولاً.', 'warning');
        this.startSubjectCheckout(ex.subject_id);
        return;
      }
      clearExamTimer();
      AppState.activeExamId = examId;
      AppState.activeExamOpportunity = opportunityLabel || 'الفرصة الأولى الأساسية';
      AppState.activeExamAnswers = {};
      AppState.lastExamResult = null;
      AppState.activeExamSecondsLeft = (ex.duration_minutes || 30) * 60;
      AppState.currentView = 'exam_runner';
      renderApp();
      window.scrollTo({ top: 0, behavior: 'smooth' });

      AppState.activeExamTimer = setInterval(() => {
        AppState.activeExamSecondsLeft--;
        const disp = document.getElementById('exam-timer-display');
        if (disp) disp.textContent = formatSeconds(AppState.activeExamSecondsLeft);
        if (AppState.activeExamSecondsLeft <= 0) {
          clearExamTimer();
          this.finishActiveExam();
        }
      }, 1000);
    },

    setExamOpportunity(val) {
      AppState.activeExamOpportunity = val;
    },

    setExamAnswer(qId, ansVal) {
      AppState.activeExamAnswers[qId] = ansVal;
      renderApp();
    },

    setExamAnswerText(qId, textVal) {
      AppState.activeExamAnswers[qId] = textVal;
    },

    finishActiveExam() {
      clearExamTimer();
      try {
        const result = global.BaccDB.submitExamAttempt(
          AppState.activeExamId,
          AppState.activeExamAnswers,
          AppState.activeExamOpportunity
        );
        AppState.lastExamResult = result;
        showToast(
          'تم تصحيح الاختبار تلقائياً! درجتك: ' +
            result.submission.score +
            ' والدرجة الأعلى المحتسبة: ' +
            result.highestOfficialScore,
          'success'
        );
        renderApp();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } catch (e) {
        showToast(e.message, 'error');
      }
    },

    recalculateBaccalaureateScore() {
      const ids = ['calc_g2_ar', 'calc_g2_en', 'calc_g2_hi', 'calc_g2_sp', 'calc_g3_s1', 'calc_g3_s2'];
      let sumHighest = 0;
      ids.forEach(prefix => {
        const el1 = document.getElementById(prefix + '_1');
        const el2 = document.getElementById(prefix + '_2');
        if (el1 && el2) {
          const v1 = Math.min(100, Math.max(0, Number(el1.value || 0)));
          const v2 = Math.min(100, Math.max(0, Number(el2.value || 0)));
          sumHighest += Math.max(v1, v2);
        }
      });
      const totalEl = document.getElementById('calc-total-score');
      const pctEl = document.getElementById('calc-total-pct');
      if (totalEl && pctEl) {
        totalEl.textContent = sumHighest + ' / 600';
        pctEl.textContent = ((sumHighest / 600) * 100).toFixed(2) + '%';
      }
      const slider = document.getElementById('calc_assessment_slider');
      const valLbl = document.getElementById('calc-assessment-val');
      const statusLbl = document.getElementById('calc-assessment-status');
      if (slider && valLbl && statusLbl) {
        const ratio = Number(slider.value || 0);
        valLbl.textContent = ratio + '% من الأداءات مكتملة';
        if (ratio >= 60) {
          statusLbl.textContent = 'مؤهل لدخول الفرصة الأولى ✓';

      clearTimers();

    generateLessonSignedUrl(lessonId) {
      try {
        const details = global.BaccDB.getSubjectDetails(AppState.selectedSubjectId);
        const les = details ? details.all_lessons.find(l => l.id === lessonId) : null;
        if (!les) return;
        let attId = les.attachments && les.attachments[0] ? les.attachments[0].id : null;
        if (!attId) {
          const created = global.BaccDB.uploadLessonAttachment({
            lesson_id: lessonId,
            file_name: les.pdf_title,
            content_text: les.pdf_content
          });
          attId = created.id;
        }
        const signed = global.BaccDB.getSignedAttachmentUrl(attId);
        AppState.lastGeneratedSignedUrl = signed;
        showToast('تم توليد رابط التحميل الآمن والموقّع من Supabase Storage ✓', 'success');
        renderApp();
      } catch (e) {
        if (e.message.includes('RLS_AUTH_REQUIRED')) {
          showToast('يرجى تسجيل الدخول أولاً لتوليد رابط موقّع (Signed URL).', 'warning');
          this.openAuthModal('student_login');
        } else {
          showToast(e.message, 'error');
        }
      }
    },

    adminQuickActivateStudent(studentId, durationDays) {
      try {
        global.BaccDB.adminActivateStudentSubscription({
          studentId,
          planId: 'plan_track',
          durationDays
        });
        showToast('تم تفعيل وتمديد اشتراك الطالب لمدة ' + durationDays + ' يوماً ✓', 'success');
        renderApp();
      } catch (e) {
        showToast(e.message, 'error');
      }
    },

    adminStopStudentSub(studentId) {
      try {
        global.BaccDB.adminExpireOrStopStudentSubscription(studentId);
        showToast('تم إيقاف اشتراك الطالب وإغلاق المنصة لحسابه حتى التجديد.', 'warning');
        renderApp();
      } catch (e) {
        showToast(e.message, 'error');
      }
    },

    adminSaveWhatsAppSettings() {
      try {
        const handle = (document.getElementById('adm-wa-handle') || {}).value || 'moaz.elokly@';
        const phone = (document.getElementById('adm-wa-phone') || {}).value || '';
        global.BaccDB.adminUpdateWhatsAppConfig(handle, phone);
        showToast('تم حفظ بيانات تواصل واتساب الإدارة (' + handle + ') بنجاح ✓', 'success');
        renderApp();
      } catch (e) {
        showToast(e.message, 'error');
      }
    },

    async adminTestAndSaveSupabase() {
      const url = (document.getElementById('adm-supa-url') || {}).value || '';
      const key = (document.getElementById('adm-supa-key') || {}).value || '';
      const res = await global.BaccSupabaseConnector.testConnection(url, key);
      if (!res.ok) {
        showToast(res.message, 'warning');
        return;
      }
      global.BaccSupabaseConnector.saveCloudConfig(url, key, true);
      showToast(res.message, 'success');
      renderApp();
    },

    adminExportBackup() {
      try {
        const label = (document.getElementById('adm-bkp-label') || {}).value || '';
        const res = global.BaccDB.adminCreateBackup(label);
        const blob = new Blob([res.exportJsonString], { type: 'application/json;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'baccalaureate_academy_backup_' + Date.now() + '.json';
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
        showToast('تم إنشاء وتنزيل النسخة الاحتياطية الموقعة بنجاح.', 'success');
        renderApp();
      } catch (e) {
        showToast(e.message, 'error');
      }
    },

    adminLoadRestoreFile(inputEl) {
      if (!inputEl.files || !inputEl.files[0]) return;
      const reader = new FileReader();
      reader.onload = e => {
        const box = document.getElementById('adm-restore-json');
        if (box) box.value = e.target.result;
        showToast('تمت قراءة ملف النسخة الاحتياطية. اضغط على تنفيذ الاستعادة.', 'info');
      };
      reader.readAsText(inputEl.files[0]);
    },

    adminExecuteRestore() {
      try {
        const jsonStr = (document.getElementById('adm-restore-json') || {}).value || '';
        if (!jsonStr.trim()) {
          showToast('يرجى اختيار ملف النسخة الاحتياطية أو لصق كود JSON أولاً.', 'warning');
          return;
        }
        global.BaccDB.adminRestoreFromJson(jsonStr);
        showToast('تمت استعادة قاعدة البيانات بالكامل بنجاح!', 'success');
        renderApp();
      } catch (e) {
        showToast(e.message, 'error');
      }
    },

    adminResetFactory() {
      try {
        global.BaccDB.adminResetToFactorySeed();
        showToast('تمت إعادة ضبط المصنع للبيانات المرجعية.', 'info');
        renderApp();
      } catch (e) {
        showToast(e.message, 'error');
      }
    }
  };

  function safeBoot() {
    try {
      localStorage.removeItem('bacc_academy_db_v2_4');
      localStorage.removeItem('bacc_academy_session_v2_4');
      localStorage.removeItem('bacc_academy_db_v4_0');
      localStorage.removeItem('bacc_academy_session_v4_0');
    } catch (e) {}
    try {
      global.BaccApp.init();
    } catch (bootErr) {
      try {
        localStorage.removeItem('bacc_academy_db_v4_0');
        localStorage.removeItem('bacc_academy_session_v4_0');
      } catch (e) {}
      try {
        global.BaccApp.init();
      } catch (e2) {
        console.error('Boot error:', e2);
      }
    }
  }
  if (document.readyState === 'loading') {
    window.addEventListener('DOMContentLoaded', safeBoot);
  } else {
    safeBoot();
  }
})(window);

  </script>
</body>
</html>
