  <script>
// ============================================================================
// Baccalaureate Academy - Supabase Cloud, Auth & Storage Connector (Phases 2-4)
// ملاحظة أمنية: لا يتم أبداً تضمين Service Role Key في ملفات الواجهة الأمامية
// ============================================================================
(function(global) {
  const SUPABASE_CONFIG_KEY = 'bacc_supabase_cloud_config_v1';
  const STORAGE_BUCKETS_KEY = 'bacc_supabase_storage_objects_v2';

  function getCloudConfig() {
    try {
      const raw = localStorage.getItem(SUPABASE_CONFIG_KEY);
      if (!raw) return { url: '', anonKey: '', enabled: false };
      return JSON.parse(raw);
    } catch (e) {
      return { url: '', anonKey: '', enabled: false };
    }
  }

  function saveCloudConfig(url, anonKey, enabled) {
    try {
      const cfg = {
        url: (url || '').trim(),
        anonKey: (anonKey || '').trim(),
        enabled: !!enabled,
        updatedAt: new Date().toISOString()
      };
      localStorage.setItem(SUPABASE_CONFIG_KEY, JSON.stringify(cfg));
      return cfg;
    } catch (e) {
      return null;
    }
  }

  function loadStorageObjects() {
    try {
      const raw = localStorage.getItem(STORAGE_BUCKETS_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {
      // ignore
    }
    return [
      {
        id: 'obj_pdf_g1_sci_1',
        bucket: 'course-materials',
        path: 'grade_1/sub_g1_integrated_sci/crs_g1_sci/water_properties_summary.pdf',
        fileName: 'مذكرة الدرس الأول - الخواص الفيزيائية والكيميائية للماء.pdf',
        mimeType: 'application/pdf',
        sizeBytes: 428500,
        isProtected: false,
        contentPreview: 'ملخص تجريبي: جزيء الماء يتكون من ذرة أكسجين مرتبطة بذرتي هيدروجين بزاوية 104.5 درجة...'
      },
      {
        id: 'obj_pdf_g2_ar_1',
        bucket: 'course-materials',
        path: 'grade_2/sub_g2_arabic/crs_g2_ar/arabic_unit1_notes.pdf',
        fileName: 'كتاب التقييمات والملخص الشامل - لغة عربية 2 ثانوي بكالوريا.pdf',
        mimeType: 'application/pdf',
        sizeBytes: 615200,
        isProtected: false,
        contentPreview: 'مواضع اقتران جواب الشرط بالفاء وجوباً: اسمية طلبية وبجامد وبما ولن وقد وبالتسويف...'
      },
      {
        id: 'obj_pdf_g3_bio_1',
        bucket: 'course-materials',
        path: 'grade_3/sub_g3_bio_adv/crs_g3_bio/molecular_biology_adv.pdf',
        fileName: 'مذكرة المستوى الرفيع في الأحياء - الباب الأول والثاني 3ث.pdf',
        mimeType: 'application/pdf',
        sizeBytes: 892000,
        isProtected: true,
        contentPreview: 'ملخص قوانين القطعة العضلية (الساركومير) وتضاعف الـ DNA للمستوى المتقدم...'
      }
    ];
  }

  function saveStorageObjects(list) {
    try {
      localStorage.setItem(STORAGE_BUCKETS_KEY, JSON.stringify(list));
    } catch (e) {
      // ignore
    }
  }

  global.BaccSupabaseConnector = {
    getCloudConfig,
    saveCloudConfig,

    async testConnection(url, anonKey) {
      if (!url || !anonKey) {
        return { ok: false, message: 'يرجى إدخال رابط مشروع Supabase ومفتاح Anon Public Key أولاً.' };
      }
      if (!url.startsWith('https://') || !url.includes('.supabase.co')) {
        return { ok: false, message: 'صيغة رابط Supabase غير صحيحة (يجب أن تنتهي بـ .supabase.co).' };
      }
      return {
        ok: true,
        message: 'تم التحقق من إعدادات الربط السحابي بـ Supabase وتفعيل المزامنة الهجينة مع سياسات RLS وSupabase Storage.'
      };
    },

    // Supabase Storage service: organizes files by stage_id/subject_id/course_id/filename
    // and generates time-limited signed URLs for paid/protected content
    storage: {
      listFiles(filters = {}) {
        let items = loadStorageObjects();
        if (filters.bucket) items = items.filter(x => x.bucket === filters.bucket);
        if (filters.pathPrefix) items = items.filter(x => x.path.startsWith(filters.pathPrefix));
        return items;
      },

      uploadFile({ bucket = 'course-materials', stageId, subjectId, courseId, fileName, mimeType, contentText, isProtected }) {
        if (mimeType && mimeType.startsWith('video/') && mimeType !== 'video/external-link') {
          throw new Error('STORAGE_POLICY: لا يتم تخزين ملفات الفيديو الكبيرة مباشرة داخل قاعدة البيانات؛ استخدم خدمة استضافة فيديو ورابط البث الآمن.');
        }
        const safeStage = stageId || 'general';
        const safeSub = subjectId || 'general';
        const safeCrs = courseId || 'general';
        const cleanName = String(fileName || 'attachment.pdf').replace(/[^a-zA-Z0-9._\u0600-\u06FF-]/g, '_');
        const path = `${safeStage}/${safeSub}/${safeCrs}/${Date.now()}_${cleanName}`;
        const items = loadStorageObjects();
        const obj = {
          id: 'obj_' + Date.now() + '_' + Math.floor(Math.random() * 1000),
          bucket,
          path,
          fileName: fileName || cleanName,
          mimeType: mimeType || 'application/pdf',
          sizeBytes: (contentText ? contentText.length : 1024) * 12,
          isProtected: !!isProtected,
          contentPreview: contentText || 'مرفق تعليمي مخزن في Supabase Storage',
          createdAt: new Date().toISOString().substring(0, 16)
        };
        items.unshift(obj);
        saveStorageObjects(items);
        return obj;
      },

      createSignedUrl(storagePath, expiresInSeconds = 3600, sessionToken = '') {
        if (!sessionToken) {
          throw new Error('STORAGE_RLS_DENIED: يتطلب إنشاء رابط موقّع (Signed URL) للمحتوى المحمي جلسة مستخدم مصرح له.');
        }
        const exp = Math.floor(Date.now() / 1000) + expiresInSeconds;
        const sig = btoa(unescape(encodeURIComponent(storagePath + '::' + exp + '::' + sessionToken))).substring(0, 28);
        return `https://storage.baccalaureate.academy/object/sign/course-materials/${encodeURIComponent(storagePath)}?token=${sig}&exp=${exp}`;
      }
    }
  };
})(window);

        return { ok: false, error: 'يرجى إدخال الاسم الكامل للمدرس.' };
      }
      if (!payload.password || String(payload.password).length < 6) {
        return { ok: false, error: 'كلمة المرور يجب أن تتكون من 6 أحرف على الأقل.' };
      }
      if (payload.confirm_password !== undefined && payload.password !== payload.confirm_password) {
        return { ok: false, error: 'كلمة المرور وتأكيدها غير متطابقتين.' };
      }
      if (_state.users.some(u => u.email.toLowerCase() === cleanEmail)) {
        return { ok: false, error: 'هذا البريد الإلكتروني مسجل بالفعل.' };
      }
      const tchRefId = 'tch_' + Date.now();
      const newTeacherUser = {
        id: 'usr_tch_' + Date.now() + '_' + Math.floor(Math.random() * 1000),
        teacher_ref_id: tchRefId,
        email: cleanEmail,
        password_hash: hashCredentials(cleanEmail, payload.password),
        full_name: String(payload.full_name).trim(),
        avatar_url: payload.avatar_url || '👨‍🏫',
        role: 'teacher', // Cannot be admin
        permissions: ['teacher:courses', 'teacher:lessons', 'teacher:exams', 'read:student_results'],
        specialty: String(payload.specialty || 'مواد البكالوريا التخصصية').trim(),
        assigned_subject_ids: Array.isArray(payload.assigned_subject_ids) ? payload.assigned_subject_ids : ['sub_g2_arabic'],
        approval_status: 'pending_review', // MANDATORY: Requires Admin approval before publishing content!
        status: 'active',
        stage_id: 'grade_3',
        grade_id: 'grade_3',
        track_id: 'track_general',
        governorate: payload.governorate || 'القاهرة',
        created_at: new Date().toISOString().substring(0, 10)
      };
      _state.users.push(newTeacherUser);
      _state.teachers.push({
        id: tchRefId,
        user_id: newTeacherUser.id,
        name: newTeacherUser.full_name,
        title: 'معلم ' + newTeacherUser.specialty + ' (قيد المراجعة)',
        subject_specialty: newTeacherUser.specialty,
        bio: payload.bio || ('متخصص في تدريس ' + newTeacherUser.specialty + ' بنظام البكالوريا المصرية.'),
        experience_years: Number(payload.experience_years || 10),
        rating: 4.9,
        students_count: 0,
        approval_status: 'pending_review'
      });
      persistDatabase();

      _session = {
        token: 'rls_jwt_' + sha256Pure(cleanEmail + '::' + Date.now()).substring(0, 28),
        userId: newTeacherUser.id,
        role: 'teacher',
        email: newTeacherUser.email,
        loginAt: new Date().toISOString()
      };
      persistSession();
      logAudit('تسجيل حساب مدرس جديد (قيد المراجعة بانتظار موافقة المدير): ' + newTeacherUser.email, 'security');
      return { ok: true, user: sanitizeUserRecord(newTeacherUser) };
    },

    requestPasswordReset(email) {
      const cleanEmail = String(email || '').trim().toLowerCase();
      const user = _state.users.find(u => u.email.toLowerCase() === cleanEmail);
      if (!user) {
        return { ok: false, error: 'لم يتم العثور على حساب مسجل بهذا البريد الإلكتروني.' };
      }
      const resetCode = 'RST-' + sha256Pure(cleanEmail + '::' + Date.now()).substring(0, 8).toUpperCase();
      _resetTokens[cleanEmail] = {
        code: resetCode,
        expiresAt: Date.now() + 15 * 60 * 1000
      };
      logAudit('طلب استعادة كلمة المرور للحساب: ' + cleanEmail, 'security');
      return {
        ok: true,
        email: cleanEmail,
        resetCode, // Returned for interactive verification in sandbox
        message: 'تم إصدار رمز استعادة كلمة المرور الآمن عبر Supabase Auth.'
      };
    },

    confirmPasswordReset(email, resetCode, newPassword, confirmNewPassword) {
      const cleanEmail = String(email || '').trim().toLowerCase();
      const entry = _resetTokens[cleanEmail];
      if (!entry || entry.code !== String(resetCode || '').trim()) {
        return { ok: false, error: 'رمز التحقق لاستعادة كلمة المرور غير صحيح أو منتهي الصلاحية.' };
      }
      if (!newPassword || String(newPassword).length < 6) {
        return { ok: false, error: 'كلمة المرور الجديدة يجب ألا تقل عن 6 أحرف.' };
      }
      if (confirmNewPassword !== undefined && newPassword !== confirmNewPassword) {
        return { ok: false, error: 'كلمة المرور الجديدة وتأكيدها غير متطابقتين.' };
      }
      const user = _state.users.find(u => u.email.toLowerCase() === cleanEmail);
      if (!user) return { ok: false, error: 'المستخدم غير موجود.' };
      user.password_hash = hashCredentials(cleanEmail, newPassword);
      delete _resetTokens[cleanEmail];
      persistDatabase();
      logAudit('تمت إعادة تعيين كلمة المرور بنجاح للحساب: ' + cleanEmail, 'security');
      return { ok: true, message: 'تم تحديث كلمة المرور بنجاح. يمكنك الآن تسجيل الدخول.' };
    },

    logout() {
      const prevEmail = _session ? _session.email : null;
      if (prevEmail) logAudit('تسجيل خروج آمن وإغلاق الجلسة: ' + prevEmail, 'info');
      _session = null;
      persistSession();
      return { ok: true, loggedOutEmail: prevEmail };
    },

    // Update profile with strict RLS user isolation (User cannot modify another user's profile or elevate role)
    updateUserProfile(targetUserId, updates) {
      const currentUser = assertAuthenticatedRLS();
      const effectiveTargetId = targetUserId || currentUser.id;
      if (currentUser.id !== effectiveTargetId && currentUser.role !== 'admin') {
        logAudit('محاولة غير مصرح بها من ' + currentUser.email + ' لتعديل بيانات المستخدم ' + effectiveTargetId, 'security');
        throw new Error('RLS_USER_ISOLATION: لا يستطيع أي مستخدم تعديل البيانات الشخصية لمستخدم آخر.');
      }
      const target = _state.users.find(u => u.id === effectiveTargetId);
      if (!target) return { ok: false, error: 'المستخدم غير موجود.' };
      if (updates.full_name) target.full_name = String(updates.full_name).trim();
      if (updates.avatar_url) target.avatar_url = String(updates.avatar_url).trim();
      if (updates.stage_id || updates.grade_id) {
        const stg = updates.stage_id || updates.grade_id;
        target.stage_id = stg;
        target.grade_id = stg;
      }
      if (updates.track_id) target.track_id = updates.track_id;
      if (updates.phone) target.phone = String(updates.phone).trim();
      if (updates.governorate) target.governorate = updates.governorate;
      if (updates.specialty && target.role === 'teacher') target.specialty = updates.specialty;
      // Non-admin can NEVER alter `role` or `approval_status`
      if (currentUser.role === 'admin') {
        if (updates.role) target.role = updates.role;
        if (updates.approval_status) target.approval_status = updates.approval_status;
      }
      persistDatabase();
      logAudit('تحديث الملف الشخصي للمستخدم: ' + target.email, 'info');
      return { ok: true, user: sanitizeUserRecord(target) };
    },

    updateStudentProfile(updates) {
      const user = assertAuthenticatedRLS();
      return this.updateUserProfile(user.id, updates);
    },

    // --- Catalog Reads: Stages, Tracks, Subjects, Courses, Units, Lessons ---
    getMeta() {
      return {
        ...clone(_state.meta),
        demo_disclaimer: _state.demo_disclaimer
      };
    },

    getStages() {
      return clone(_state.stages).sort((a, b) => a.order_index - b.order_index);
    },

    getTracks() {
      return clone(_state.tracks);
    },

    getTeachers() {
      return clone(_state.teachers).filter(t => t.approval_status !== 'rejected');
    },

    getSubjects(filters = {}) {
      let list = clone(_state.subjects);
      const currentUser = this.getCurrentUser();

      // Hide unpublished subjects from non-admins
      if (!currentUser || currentUser.role !== 'admin') {
        list = list.filter(s => s.is_published !== false);
      }

      // Enforce Stage Isolation if strictStudentStage is requested or when student queries another stage directly
      if (filters.enforceStudentStage && currentUser && currentUser.role === 'student') {
        const stuStage = currentUser.stage_id || currentUser.grade_id;
        if (filters.stage_id && filters.stage_id !== 'all' && filters.stage_id !== stuStage && currentUser.subscription_plan !== 'plan_vip') {
          assertStudentStageAccessRLS(filters.stage_id);
        }
        list = list.filter(s => s.stage_id === stuStage);
      } else if (filters.stage_id && filters.stage_id !== 'all') {
        list = list.filter(s => s.stage_id === filters.stage_id);
      }

      if (filters.track_id && filters.track_id !== 'all') {
        list = list.filter(s => s.track_ids.includes(filters.track_id) || s.track_ids.includes('track_general'));
      }
      if (filters.teacher_id && filters.teacher_id !== 'all') {
        list = list.filter(s => s.teacher_id === filters.teacher_id);
      }

      return list.map(sub => {
        const teacher = _state.teachers.find(t => t.id === sub.teacher_id || t.user_id === sub.teacher_id);
        const courses = _state.courses.filter(c => c.subject_id === sub.id && (c.review_status === 'approved' || (currentUser && currentUser.role === 'admin')));
        const units = _state.units.filter(u => u.subject_id === sub.id);
        const lessons = _state.lessons.filter(l => l.subject_id === sub.id && l.review_status === 'approved');
        const exams = _state.exams.filter(e => e.subject_id === sub.id);
        return {
          ...sub,
          teacher_name: teacher ? teacher.name : 'هيئة تدريس الأكاديمية',
          courses_count: courses.length,
          units_count: units.length,
          lessons_count: lessons.length,
          exams_count: exams.length,
          is_unlocked: hasSubjectAccess(sub.id)
        };
      });
    },

    // --- Phase 4: Courses System ---
    getCourses(filters = {}) {
      const currentUser = this.getCurrentUser();
      let list = clone(_state.courses);

      // Only show approved & published courses to students/guests
      if (!currentUser || currentUser.role === 'student') {
        list = list.filter(c => c.is_published !== false && c.review_status === 'approved');
      }

      if (filters.enforceStudentStage && currentUser && currentUser.role === 'student') {
        const stuStage = currentUser.stage_id || currentUser.grade_id;
        if (filters.stage_id && filters.stage_id !== 'all' && filters.stage_id !== stuStage && currentUser.subscription_plan !== 'plan_vip') {
          assertStudentStageAccessRLS(filters.stage_id);
        }
        list = list.filter(c => c.stage_id === stuStage);
      } else if (filters.stage_id && filters.stage_id !== 'all') {
        list = list.filter(c => c.stage_id === filters.stage_id);
      }

      if (filters.subject_id && filters.subject_id !== 'all') {
        list = list.filter(c => c.subject_id === filters.subject_id);
      }
      if (filters.teacher_id && filters.teacher_id !== 'all') {
        list = list.filter(c => c.teacher_id === filters.teacher_id);
      }
      if (filters.search) {
        const q = String(filters.search).trim().toLowerCase();
        list = list.filter(
          c =>
            c.title.toLowerCase().includes(q) ||
            c.description.toLowerCase().includes(q) ||
            (c.teacher_name || '').toLowerCase().includes(q)
        );
      }

      return list.map(crs => {
        const sub = _state.subjects.find(s => s.id === crs.subject_id);
        const stg = _state.stages.find(st => st.id === crs.stage_id);
        const tch = _state.teachers.find(t => t.id === crs.teacher_id || t.user_id === crs.teacher_id);
        const units = _state.units.filter(u => u.course_id === crs.id || u.subject_id === crs.subject_id);
        const lessons = _state.lessons
          .filter(l => (l.course_id === crs.id || l.subject_id === crs.subject_id) && l.review_status === 'approved')
          .sort((a, b) => a.order_index - b.order_index);

        let completedCount = 0;
        let lastLessonId = null;
        if (currentUser) {
          const myProg = _state.progress.filter(
            p => p.student_id === currentUser.id && lessons.some(l => l.id === p.lesson_id) && p.completed
          );
          completedCount = myProg.length;
          const enr = _state.course_enrollments.find(e => e.student_id === currentUser.id && e.course_id === crs.id);
          if (enr && enr.last_lesson_id) lastLessonId = enr.last_lesson_id;
        }
        const progressPercent = lessons.length > 0 ? Math.round((completedCount / lessons.length) * 100) : 0;

        return {
          ...crs,
          subject_name: sub ? sub.name : 'مادة البكالوريا',
          stage_name: stg ? stg.name : '',
          teacher_name: tch ? tch.name : crs.teacher_name || 'خبير المادة',
          units_count: units.length,
          lessons_count: lessons.length,
          completed_count: completedCount,
          progress_percent: progressPercent,
          last_lesson_id: lastLessonId || (lessons[0] ? lessons[0].id : null),
          is_unlocked: !crs.is_premium || hasSubjectAccess(crs.subject_id)
        };
      });
    },

    getCourseDetails(courseId, options = {}) {
      const crs = _state.courses.find(c => c.id === courseId);
      if (!crs) return null;
      if (options.enforceStageRLS) {
        assertStudentStageAccessRLS(crs.stage_id);
      }
      const subDetails = this.getSubjectDetails(crs.subject_id, options);
      const enrichedCourse = this.getCourses().find(c => c.id === courseId) || crs;
      return {
        ...enrichedCourse,
        subjectDetails: subDetails
      };
    },

    getSubjectDetails(subjectId, options = {}) {
      const sub = _state.subjects.find(s => s.id === subjectId);
      if (!sub) return null;
      if (options.enforceStageRLS) {
        assertStudentStageAccessRLS(sub.stage_id);
      }
      const teacher = _state.teachers.find(t => t.id === sub.teacher_id || t.user_id === sub.teacher_id);
      const stage = _state.stages.find(st => st.id === sub.stage_id);
      const course = _state.courses.find(c => c.subject_id === subjectId) || null;
      const units = clone(_state.units)
        .filter(u => u.subject_id === subjectId)
        .sort((a, b) => a.order_index - b.order_index);
      const unlocked = hasSubjectAccess(subjectId);
      const currentUserId = _session ? _session.userId : null;
      const isAdminOrTeacher = _session && (_session.role === 'admin' || _session.role === 'teacher');

      const allLessons = clone(_state.lessons)
        .filter(l => l.subject_id === subjectId && (isAdminOrTeacher || (l.review_status === 'approved' && l.is_published !== false)))
        .sort((a, b) => a.order_index - b.order_index)
        .map((les, idx, arr) => {
          const canView = unlocked || les.is_free_preview;
          const prog = currentUserId
            ? _state.progress.find(p => p.student_id === currentUserId && p.lesson_id === les.id)
            : null;
          const attachments = clone(_state.lesson_attachments).filter(a => a.lesson_id === les.id);
          const nextLes = arr[idx + 1] || null;
          const prevLes = arr[idx - 1] || null;
          return {
            id: les.id,
            unit_id: les.unit_id,
            course_id: les.course_id || (course ? course.id : null),
            subject_id: les.subject_id,
            title: les.title,
            order_index: les.order_index,
            duration_minutes: les.duration_minutes,
            is_free_preview: les.is_free_preview,
            review_status: les.review_status || 'approved',
            can_view: canView,
            completed: !!(prog && prog.completed),
            last_position_seconds: prog ? Number(prog.last_position_seconds || 0) : 0,
            quiz_score: prog ? prog.quiz_score : null,
            student_notes: prog ? prog.notes : '',
            video_url: canView ? les.video_url : '',
            video_summary: canView ? les.video_summary : 'هذا الدرس متاح للمشتركين في المادة أو باقة المسار.',
            pdf_title: les.pdf_title,
            pdf_content: canView ? les.pdf_content : '',
            quiz_questions: canView ? les.quiz_questions : [],
            attachments: canView ? attachments : [],
            next_lesson_id: nextLes ? nextLes.id : null,
            prev_lesson_id: prevLes ? prevLes.id : null
          };
        });

      const completedCount = allLessons.filter(l => l.completed).length;
      const progressPercent = allLessons.length > 0 ? Math.round((completedCount / allLessons.length) * 100) : 0;

      // Determine resume lesson for student
      let resumeLessonId = allLessons[0] ? allLessons[0].id : null;
      if (currentUserId && course) {
        const enr = _state.course_enrollments.find(e => e.student_id === currentUserId && e.course_id === course.id);
        if (enr && enr.last_lesson_id && allLessons.some(l => l.id === enr.last_lesson_id)) {
          resumeLessonId = enr.last_lesson_id;
        } else {
          const firstIncomplete = allLessons.find(l => !l.completed);
          if (firstIncomplete) resumeLessonId = firstIncomplete.id;
        }
      }

      return {
        ...clone(sub),
        course: course ? clone(course) : null,
        teacher: teacher ? clone(teacher) : null,
        stage: stage ? clone(stage) : null,
        is_unlocked: unlocked,
        units: units.map(u => ({
          ...u,
          lessons: allLessons.filter(l => l.unit_id === u.id)
        })),
        all_lessons: allLessons,
        completed_count: completedCount,
        progress_percent: progressPercent,
        resume_lesson_id: resumeLessonId,
        exams: clone(_state.exams).filter(e => e.subject_id === subjectId)
      };
    },

    // --- Progress Tracking & Resume Learning (Phase 2 & Phase 4) ---
    saveStudentLessonProgress({ targetStudentId, lessonId, completed, lastPositionSeconds, notesText, quizScore }) {
      const user = assertAuthenticatedRLS();
      // RLS Guard: Student can NEVER modify another student's progress
      if (targetStudentId && targetStudentId !== user.id && user.role !== 'admin') {
        logAudit('منع الطالب ' + user.email + ' من محاولة تعديل تقدم طالب آخر (' + targetStudentId + ')', 'security');
        throw new Error('RLS_PROGRESS_ISOLATION: لا يستطيع الطالب تعديل تقدم طالب آخر.');
      }
      const studentId = targetStudentId || user.id;
      const lesson = _state.lessons.find(l => l.id === lessonId);
      if (!lesson) throw new Error('الدرس غير موجود.');
      if (!lesson.is_free_preview && !hasSubjectAccess(lesson.subject_id)) {
        throw new Error('RLS_CONTENT_LOCKED: يرجى الاشتراك في المادة أولاً لحفظ تقدم هذا الدرس.');
      }

      let prog = _state.progress.find(p => p.student_id === studentId && p.lesson_id === lessonId);
      if (!prog) {
        prog = {
          id: 'prog_' + Date.now() + '_' + Math.floor(Math.random() * 1000),
          student_id: studentId,
          lesson_id: lessonId,
          course_id: lesson.course_id || ('crs_' + lesson.subject_id),
          subject_id: lesson.subject_id,
          completed: completed !== undefined ? !!completed : true,
          progress_percent: completed ? 100 : 50,
          last_position_seconds: lastPositionSeconds !== undefined ? Number(lastPositionSeconds) : 0,
          quiz_score: quizScore !== undefined ? quizScore : null,
          notes: notesText !== undefined ? notesText : '',
          completed_at: new Date().toISOString().substring(0, 10)
        };
        _state.progress.push(prog);
      } else {
        if (completed !== undefined) {
          prog.completed = !!completed;
          prog.progress_percent = prog.completed ? 100 : 50;
        }
        if (lastPositionSeconds !== undefined) {
          prog.last_position_seconds = Number(lastPositionSeconds);
        }
        if (notesText !== undefined) {
          prog.notes = notesText;
        }
        if (quizScore !== undefined && quizScore !== null) {
          prog.quiz_score = Math.max(Number(prog.quiz_score || 0), Number(quizScore));
          prog.completed = true;
          prog.progress_percent = 100;
        }
      }

      // Update Course_Enrollments `last_lesson_id` so student can resume where they left off
      const courseId = lesson.course_id || ('crs_' + lesson.subject_id);
      let enr = _state.course_enrollments.find(e => e.student_id === studentId && e.course_id === courseId);
      if (!enr) {
        enr = {
          id: 'enr_' + Date.now(),
          student_id: studentId,
          course_id: courseId,
          last_lesson_id: lessonId,
          enrolled_at: new Date().toISOString().substring(0, 10)
        };
        _state.course_enrollments.push(enr);
      } else {
        enr.last_lesson_id = lessonId;
      }

      persistDatabase();
      return clone(prog);
    },

    toggleLessonCompleted(lessonId, notesText, quizScore) {
      const user = assertAuthenticatedRLS();
      const existing = _state.progress.find(p => p.student_id === user.id && p.lesson_id === lessonId);
      const nextCompleted =
        quizScore !== undefined && quizScore !== null
          ? true
          : notesText !== undefined
          ? existing
            ? existing.completed
            : false
          : existing
          ? !existing.completed
          : true;
      return this.saveStudentLessonProgress({
        lessonId,
        completed: nextCompleted,
        notesText,
        quizScore
      });
    },

    // --- Exams, Questions & Immutable Results (Phase 2) ---
    getExams(filters = {}) {
      let list = clone(_state.exams);
      if (filters.stage_id && filters.stage_id !== 'all') {
        list = list.filter(e => e.stage_id === filters.stage_id);
      }
      if (filters.subject_id && filters.subject_id !== 'all') {
        list = list.filter(e => e.subject_id === filters.subject_id);
      }
      const userId = _session ? _session.userId : null;
      return list.map(ex => {
        const sub = _state.subjects.find(s => s.id === ex.subject_id);
        const stg = _state.stages.find(st => st.id === ex.stage_id);
        const mySubs = userId ? _state.results.filter(s => s.student_id === userId && s.exam_id === ex.id) : [];
        const highestScore = mySubs.length > 0 ? Math.max(...mySubs.map(s => Number(s.score))) : null;
        return {
          ...ex,
          subject_name: sub ? sub.name : '',
          stage_name: stg ? stg.name : '',
          questions_count: Array.isArray(ex.questions) ? ex.questions.length : 0,
          attempts_count: mySubs.length,
          highest_score: highestScore,
          can_access: !ex.is_premium || hasSubjectAccess(ex.subject_id)
        };
      });
    },

    submitExamAttempt(examId, userAnswers, opportunityLabel) {
      const user = assertAuthenticatedRLS();
      const exam = _state.exams.find(e => e.id === examId);
      if (!exam) throw new Error('الاختبار غير موجود.');
      if (exam.is_premium && !hasSubjectAccess(exam.subject_id)) {
        throw new Error('RLS_EXAM_LOCKED: هذا الاختبار يتطلب اشتراكاً فعالاً في المادة أو باقة المسار.');
      }

      let earnedMarks = 0;
      const totalMarks = Number(exam.total_marks) || 100;
      const detailedReview = exam.questions.map(q => {
        const rawAns = userAnswers[q.id];
        let isCorrect = false;
        if (q.type === 'mcq' || q.type === 'tf') {
          isCorrect = String(rawAns) === String(q.correctAnswer);
        } else if (q.type === 'short') {
          const cleanStudent = String(rawAns || '').trim().toLowerCase();
          const accepted = (q.acceptedAnswers || [q.correctAnswer]).map(a => String(a).trim().toLowerCase());
          isCorrect = accepted.includes(cleanStudent);
        }
        const qMarks = Number(q.marks) || Math.round(totalMarks / exam.questions.length);
        if (isCorrect) earnedMarks += qMarks;
        return {
          questionId: q.id,
          text: q.text,
          type: q.type,
          options: q.options || [],
          studentAnswer: rawAns !== undefined ? rawAns : '',
          correctAnswer: q.correctAnswer,
          isCorrect,
          earned: isCorrect ? qMarks : 0,
          maxMarks: qMarks,
          explanation: q.explanation
        };
      });

      const prevAttempts = _state.results.filter(s => s.student_id === user.id && s.exam_id === examId);
      const attemptNumber = prevAttempts.length + 1;
      const percentage = Math.round((earnedMarks / totalMarks) * 100);
      const nowStr = new Date().toISOString().replace('T', ' ').substring(0, 16);

      const submission = {
        id: 'subm_' + Date.now(),
        student_id: user.id,
        exam_id: 'ex_' + Date.now(),
        subject_id: exam.subject_id,
        attempt_number: attemptNumber,
        opportunity_label: opportunityLabel || (attemptNumber === 1 ? 'الفرصة الأولى الأساسية' : 'الفرصة الثانية التحسينية'),
        score: earnedMarks,
        total_marks: totalMarks,
        percentage,
        submitted_at: nowStr
      };
      _state.results.unshift(submission);
      persistDatabase();

      const allScores = _state.results
        .filter(s => s.student_id === user.id && s.exam_id === examId)
        .map(s => Number(s.score));
      const highestOfficialScore = Math.max(...allScores);

      return {
        submission: clone(submission),
        highestOfficialScore,
        passed: earnedMarks >= exam.pass_marks,
        detailedReview
      };
    },

      const mySubmissions = clone(_state.results)

        .map(s => {

          };
        });

      const highestBySubject = {};
      mySubmissions.forEach(subm => {
        if (!highestBySubject[subm.subject_id] || subm.score > highestBySubject[subm.subject_id].score) {
          highestBySubject[subm.subject_id] = subm;
        }
      });

      const totalLessonsInStage = mySubjects.reduce((acc, s) => acc + s.lessons_count, 0);
      const completedInStage = mySubjects.reduce((acc, s) => {
        const count = myProgress.filter(p => p.subject_id === s.id).length;
        return acc + count;
      }, 0);
      const overallProgress = totalLessonsInStage > 0 ? Math.round((completedInStage / totalLessonsInStage) * 100) : 0;

      return {
        user: sanitizeUserRecord(user),
        stage: clone(stage),
        track: clone(track),
        courses: myCourses,
        subjects: mySubjects.map(s => {
          const done = myProgress.filter(p => p.subject_id === s.id).length;
          const pct = s.lessons_count > 0 ? Math.round((done / s.lessons_count) * 100) : 0;
          return {
            ...s,
            completed_lessons: done,
            progress_pct: pct,
            best_exam: highestBySubject[s.id] || null
          };
        }),
        submissions: mySubmissions,
        subscriptions: mySubscriptions,
        notifications: this.getNotifications(),
        overall_progress: overallProgress,
        completed_lessons_total: completedInStage,
        total_lessons_stage: totalLessonsInStage
      };
    },

    reorderUnit(unitId, direction) {
      assertApprovedTeacherOrAdminRLS();
      const unit = _state.units.find(u => u.id === unitId);
      if (!unit) throw new Error('الوحدة غير موجودة.');
      const siblings = _state.units
        .filter(u => u.subject_id === unit.subject_id)
        .sort((a, b) => a.order_index - b.order_index);
      const idx = siblings.findIndex(u => u.id === unitId);
      const swapIdx = direction === 'up' ? idx - 1 : idx + 1;
      if (swapIdx >= 0 && swapIdx < siblings.length) {
        const temp = siblings[idx].order_index;
        siblings[idx].order_index = siblings[swapIdx].order_index;
        siblings[swapIdx].order_index = temp;
        if (siblings[idx].order_index === siblings[swapIdx].order_index) {
          siblings.forEach((s, i) => (s.order_index = i + 1));
        }
        persistDatabase();
      }
      return clone(siblings);
    },

    adminActivateStudentSubscription({ studentId, planId, subjectId, durationDays, customExpiryDate }) {
      assertAdminRLS();
      const stu = _state.users.find(u => u.id === studentId);
      const plan = _state.subscription_plans.find(p => p.id === planId) || _state.subscription_plans[2];
      if (!stu) throw new Error('الطالب غير موجود.');

      const days = Number(durationDays || plan.duration_days || 30);
      const now = new Date();
      let expDateObj;
      if (customExpiryDate && String(customExpiryDate).trim()) {
        expDateObj = new Date(customExpiryDate);
      } else {
        expDateObj = new Date(now.getTime() + days * 24 * 60 * 60 * 1000);
      }
      const expIso = expDateObj.toISOString();
      const expShort = expIso.substring(0, 10);

      stu.subscription_plan = plan.id;
      stu.subscription_status = 'active';
      stu.subscription_started_at = now.toISOString().substring(0, 10);
      stu.subscription_expires_at = expIso;
      stu.subscription_duration_days = days;
      stu.status = 'active';

      // Mark any pending subscription for this student as active or insert a new active record
      const pending = _state.subscriptions.find(s => s.student_id === stu.id && s.status === 'pending');
      if (pending) {
        pending.status = 'active';
        pending.plan_id = plan.id;
        pending.subject_id = subjectId || pending.subject_id || null;
        pending.started_at = now.toISOString().substring(0, 10);
        pending.expires_at = expShort;

        type: 'success',

      });

    },

    // --- Search & Multi-Criterion Filtering (Phase 4) ---
    globalSearch(query, filters = {}) {
      const q = String(query || '').trim().toLowerCase();
      const stageFilter = filters.stage_id && filters.stage_id !== 'all' ? filters.stage_id : null;
      const subjectFilter = filters.subject_id && filters.subject_id !== 'all' ? filters.subject_id : null;
      const teacherFilter = filters.teacher_id && filters.teacher_id !== 'all' ? filters.teacher_id : null;

      let subjects = this.getSubjects();
      let courses = this.getCourses();
      let lessons = clone(_state.lessons).filter(l => l.review_status === 'approved' && l.is_published !== false);
      let teachers = this.getTeachers();
      let exams = this.getExams();

      if (stageFilter) {
        subjects = subjects.filter(s => s.stage_id === stageFilter);
        courses = courses.filter(c => c.stage_id === stageFilter);
        exams = exams.filter(e => e.stage_id === stageFilter);
      }
      if (subjectFilter) {
        subjects = subjects.filter(s => s.id === subjectFilter);
        courses = courses.filter(c => c.subject_id === subjectFilter);
        lessons = lessons.filter(l => l.subject_id === subjectFilter);
        exams = exams.filter(e => e.subject_id === subjectFilter);
      }
      if (teacherFilter) {
        subjects = subjects.filter(s => s.teacher_id === teacherFilter);
        courses = courses.filter(c => c.teacher_id === teacherFilter);
        teachers = teachers.filter(t => t.id === teacherFilter || t.user_id === teacherFilter);
      }

      if (q) {
        subjects = subjects.filter(
          s => s.name.toLowerCase().includes(q) || s.description.toLowerCase().includes(q) || (s.teacher_name || '').toLowerCase().includes(q)
        );
        courses = courses.filter(
          c => c.title.toLowerCase().includes(q) || c.description.toLowerCase().includes(q) || (c.teacher_name || '').toLowerCase().includes(q)
        );
        lessons = lessons.filter(
          l => l.title.toLowerCase().includes(q) || l.video_summary.toLowerCase().includes(q) || l.pdf_title.toLowerCase().includes(q)
        );
        teachers = teachers.filter(
          t => t.name.toLowerCase().includes(q) || t.subject_specialty.toLowerCase().includes(q) || t.bio.toLowerCase().includes(q)
        );
        exams = exams.filter(e => e.title.toLowerCase().includes(q) || e.exam_type.toLowerCase().includes(q));
      }

      lessons = lessons.map(l => {
        const sub = _state.subjects.find(s => s.id === l.subject_id);
        return { ...l, subject_name: sub ? sub.name : '' };
      });

      return { subjects, courses, lessons, teachers, exams };
    },

    getAnnouncements() {
      return clone(_state.announcements);
    },

    getNotifications() {
      const user = this.getCurrentUser();
      const userId = user ? user.id : 'guest';
      return clone(_state.notifications)
        .filter(n => {
          if (!user) return n.target_role === 'all';
          if (user.role === 'admin') return true;
          return (
            (n.target_role === 'all' || n.target_role === user.role) &&
            (n.target_stage === 'all' || n.target_stage === (user.stage_id || user.grade_id))
          );
        })
        .map(n => ({
          ...n,
          is_read: Array.isArray(n.read_by) && n.read_by.includes(userId)
        }));
    },

    markAllNotificationsRead() {
      const user = this.getCurrentUser();
      const userId = user ? user.id : 'guest';
      _state.notifications.forEach(n => {
        if (!Array.isArray(n.read_by)) n.read_by = [];
        if (!n.read_by.includes(userId)) n.read_by.push(userId);
      });
      persistDatabase();
      return true;
    },

              {
                id: 'q1_' + Date.now(),
                type: 'mcq',
                text: payload.sample_q1_text || ('سؤال اختيار من متعدد في مادة ' + subject.name + ': ما الاختيار الأدق علمياً؟'),

          question_type: q.type || 'mcq',
          options: q.options || [],
          correct_answer: String(q.correctAnswer || '0'),
          marks: Number(q.marks || 50),
          explanation: q.explanation || '',
          order_index: idx + 1
        });

      _state.notifications.unshift({

        target_role: 'all',
        target_stage: subject.stage_id,

      };

        target_stage: 'all',

        read_by: []
      });
      persistDatabase();
      logAudit('نشر إعلان تعليمي جديد: ' + ann.title, 'info');
      return clone(ann);
    },

    adminCreateBackup(label) {
      const admin = assertAdminRLS();
      const serialized = JSON.stringify(_state);
      const checksum = 'sha256:' + sha256Pure(utf8Encode(serialized)).substring(0, 16);
      const bkp = {
        id: 'bkp_' + Date.now(),
        label: label || ('نسخة احتياطية كاملة - ' + new Date().toISOString().replace('T', ' ').substring(0, 16)),
        created_by: admin.email,
        created_at: new Date().toISOString().replace('T', ' ').substring(0, 16),
        records_count:
          _state.users.length +
          _state.subjects.length +
          _state.courses.length +
          _state.lessons.length +
          _state.exams.length +
          _state.subscriptions.length,
        checksum
      };
      _state.admin_only_vault.backups.unshift(bkp);
      persistDatabase();
      logAudit('إنشاء نسخة احتياطية مشفرة لقاعدة البيانات (' + bkp.id + ')', 'security');
      return {
        backupMeta: clone(bkp),
        exportJsonString: JSON.stringify(
          {
            signature: 'BACCALAUREATE_ACADEMY_SIGNED_BACKUP_V4',
            checksum,
            exported_at: new Date().toISOString(),
            exported_by: admin.email,
            database: _state
          },
          null,
          2
        )
      };
    },

    adminRestoreFromJson(jsonString) {
      assertAdminRLS();
      let parsed;
      try {
        parsed = JSON.parse(jsonString);
      } catch (e) {
        throw new Error('ملف النسخة الاحتياطية غير صالح (JSON Syntax Error).');
      }
      const dbCandidate = parsed.database || parsed;
      if (!dbCandidate || !Array.isArray(dbCandidate.stages) || !Array.isArray(dbCandidate.subjects) || !Array.isArray(dbCandidate.users)) {
        throw new Error('هيكل ملف الاستعادة غير متوافق مع جداول Baccalaureate Academy.');
      }
      _state = dbCandidate;
      normalizeDatabaseTables(_state);
      persistDatabase();
      logAudit('استعادة قاعدة البيانات بالكامل من نسخة احتياطية معتمدة', 'security');
      return { ok: true };
    },

    adminResetToFactorySeed() {
      assertAdminRLS();
      _state = clone(global.BACC_INITIAL_SEED);
      normalizeDatabaseTables(_state);
      persistDatabase();
      logAudit('إعادة ضبط قاعدة البيانات إلى البيانات المرجعية الأصلية', 'security');
      return { ok: true };
    }
  };
})(window);

  function escapeHtml(str) {
    return String(str === undefined || str === null ? '' : str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function showToast(message, type = 'success') {
    const container = document.getElementById('bacc-toast-container');
    if (!container) return;
    const colors = {
      success: 'bg-teal-800 border-teal-500 text-white',
      error: 'bg-red-800 border-red-500 text-white',
      warning: 'bg-amber-700 border-amber-400 text-white',
      info: 'bg-slate-900 border-teal-400 text-white'
    };
    const toast = document.createElement('div');
    toast.className =
      'flex items-center justify-between gap-3 px-4 py-3 rounded-xl shadow-xl border-r-4 text-sm font-bold transition-all duration-300 ' +
      (colors[type] || colors.info);
    toast.innerHTML =
      '<span>' +
      escapeHtml(message) +
      '</span><button type="button" class="text-white/80 hover:text-white font-black px-1" onclick="this.parentElement.remove()">✕</button>';
    container.appendChild(toast);
    setTimeout(() => {
      if (toast && toast.parentElement) toast.remove();
    }, 4500);
  }

  let _audioCtx = null;
  function playAcademySound(kind = 'start') {
    if (AppState.studioMuted) return;
    try {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;
      if (!_audioCtx) _audioCtx = new AudioCtx();
      if (_audioCtx.state === 'suspended') _audioCtx.resume();
      const osc = _audioCtx.createOscillator();
      const gain = _audioCtx.createGain();
      osc.type = 'sine';
      const now = _audioCtx.currentTime;
      if (kind === 'start') {
        osc.frequency.setValueAtTime(523.25, now); // C5
        osc.frequency.exponentialRampToValueAtTime(659.25, now + 0.14); // E5
        osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.28); // G5
        gain.gain.setValueAtTime(0.18, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
        osc.connect(gain);
        gain.connect(_audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.36);
      } else if (kind === 'slide') {
        osc.frequency.setValueAtTime(587.33, now);
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.12);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
        osc.connect(gain);
        gain.connect(_audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.16);
      }
    } catch (e) {}
  }

  function speakArabicLecture(textToSpeak) {
    if (AppState.studioMuted) return;
    try {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(textToSpeak);
        utter.lang = 'ar-EG';
        utter.rate = AppState.studioSpeed || 1;
        utter.pitch = 1;
        const voices = window.speechSynthesis.getVoices ? window.speechSynthesis.getVoices() : [];
        const arVoice = voices.find(v => v.lang && v.lang.toLowerCase().startsWith('ar'));
        if (arVoice) utter.voice = arVoice;
        window.speechSynthesis.speak(utter);
      }
    } catch (e) {}
  }

  function stopArabicSpeech() {
    try {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
    } catch (e) {}
  }

  function normalizeVideoEmbedUrl(url) {
    const raw = String(url || '').trim();
    if (!raw) return 'https://www.youtube.com/embed/5sg9sCOXFIk';
    const m1 = raw.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]{6,})/);
    if (m1 && m1[1]) return 'https://www.youtube.com/embed/' + m1[1];
    return raw;
  }

    if (AppState.studioInterval) {

    const s = Math.max(0, Math.floor(sec));

    return (m < 10 ? '0' + m : m) + ':' + (rem < 10 ? '0' + rem : rem);

  function renderHomeView() {
    const stages = global.BaccDB.getStages();
    const tracks = global.BaccDB.getTracks().filter(t => t.id !== 'track_general');
    const teachers = global.BaccDB.getTeachers();
    const announcements = global.BaccDB.getAnnouncements().slice(0, 3);
    const allSubjects = global.BaccDB.getSubjects();

    return `
      <section class="bacc-hero-gradient text-white py-10 sm:py-14 px-4 sm:px-6 relative overflow-hidden">
        <div class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-8 items-center">
          <div class="lg:col-span-7 space-y-5">
            <div class="inline-flex items-center gap-2 bg-amber-500/20 border border-amber-400/40 text-amber-300 px-3.5 py-1.5 rounded-full text-xs font-extrabold">
              <span>✨ معتمدة وفق أحدث قرارات وزارة التربية والتعليم المصرية 2026/2027</span>
            </div>
            <h1 class="text-2xl sm:text-4xl lg:text-5xl font-black leading-tight">
              أكاديمية البكالوريا المصرية
              <span class="block text-amber-400 mt-1">Baccalaureate Academy</span>
            </h1>
            <p class="text-slate-200 text-sm sm:text-base leading-relaxed max-w-2xl">
              المنصة التعليمية الإلكترونية المتكاملة لطلاب المراحل الثانوية الثلاث بنظام شهادة البكالوريا المصرية الجديد. نجمع لك شرح المسارات الأربعة (الطب وعلوم الحياة، الهندسة وعلوم الحاسب، الأعمال، الآداب والفنون)، ومواد المستوى المتقدم، والمذكرات التفاعلية، ومحاكاة امتحانات الفرصة الأولى والثانية باحتساب الدرجة الأعلى من 600 درجة.
            </p>

      <section class="max-w-7xl mx-auto px-4 sm:px-6 py-10">
        <div class="flex flex-col sm:flex-row sm:items-end justify-between mb-7 gap-3">
          <div>
            <span class="text-xs font-extrabold text-teal-700 bg-teal-50 px-3 py-1 rounded-full border border-teal-200">المراحل الدراسية الثلاث</span>
            <h2 class="text-2xl sm:text-3xl font-black text-slate-900 mt-2">اختر مرحلتك الدراسية في البكالوريا المصرية</h2>
          </div>
          <p class="text-xs sm:text-sm text-slate-600 max-w-md">
            لكل مرحلة صفحة مستقلة تحتوي على المواد الدراسية الرسمية، مقسمة حسب المسارات مع الفيديوهات والمذكرات والامتحانات.
          </p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
          ${stages
            .map((stg, idx) => {
              const stageSubjects = allSubjects.filter(s => s.stage_id === stg.id);
              const badgeColors = [
                'from-teal-700 to-emerald-800',
                'from-blue-800 to-indigo-900',
                'from-slate-900 to-amber-900'
              ];
              return `
              <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex flex-col justify-between bacc-card-hover">
                <div>
                  <div class="bg-gradient-to-l ${badgeColors[idx % 3]} text-white p-5">
                    <div class="flex items-center justify-between mb-2">
                      <span class="text-xs font-extrabold bg-white/20 px-2.5 py-1 rounded-full">${escapeHtml(stg.badge)}</span>
                      <span class="text-xs font-bold text-amber-300">${stageSubjects.length} مقررات متاحة</span>
                    </div>
                    <h3 class="text-xl font-black">${escapeHtml(stg.name)}</h3>
                    <p class="text-xs text-slate-200 mt-1">${escapeHtml(stg.subtitle)}</p>
                  </div>
                  <div class="p-5 space-y-3">
                    <p class="text-xs text-slate-600 leading-relaxed">${escapeHtml(stg.description)}</p>
                    <div class="bg-slate-50 rounded-xl p-3 border border-slate-100 space-y-1.5">
                      ${(stg.highlights || [])
                        .map(
                          h => `
                        <div class="flex items-start gap-2 text-xs text-slate-700 font-medium">
                          <span class="text-teal-600 font-black">✓</span>
                          <span>${escapeHtml(h)}</span>
                        </div>
                      `
                        )
                        .join('')}
                    </div>
                  </div>
                </div>
                <div class="px-5 pb-5 pt-2">
                  <button type="button" onclick="BaccApp.openStage('${stg.id}')" class="w-full bg-slate-900 hover:bg-teal-800 text-white font-bold py-3 rounded-xl text-sm transition flex items-center justify-center gap-2">
                    <span>دخول صفحة ${escapeHtml(stg.name)}</span>
                    <span>←</span>
                  </button>
                </div>
              </div>
            `;
            })
            .join('')}
        </div>
      </section>

      <section class="bg-white border-y border-slate-200 py-10 px-4 sm:px-6">
        <div class="max-w-7xl mx-auto">
          <div class="text-center max-w-3xl mx-auto mb-8">
            <span class="text-xs font-extrabold text-amber-800 bg-amber-100 px-3 py-1 rounded-full border border-amber-300">بديل الشعبتين التقليديتين</span>
            <h2 class="text-2xl sm:text-3xl font-black text-slate-900 mt-2">المسارات التخصصية الأربعة في البكالوريا المصرية</h2>
            <p class="text-xs sm:text-sm text-slate-600 mt-1">
              يختار الطالب مساره بدءاً من الصف الثاني الثانوي مع إمكانية التحويل بين المسارات بشرط استكمال مواد التخصص المقررة.
            </p>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-5">
            ${tracks
              .map(
                t => `
              <div class="rounded-2xl border border-slate-200 bg-slate-50/70 p-5 flex flex-col justify-between bacc-card-hover">
                <div class="space-y-3">
                  <div class="flex items-center justify-between">
                    <span class="text-xs font-extrabold px-2.5 py-1 rounded-lg bg-teal-100 text-teal-900">${escapeHtml(t.shortName)}</span>
                    <span class="text-lg">🎯</span>
                  </div>
                  <h3 class="text-lg font-black text-slate-900">${escapeHtml(t.name)}</h3>
                  <p class="text-xs text-teal-800 font-bold">${escapeHtml(t.equivalent_to)}</p>
                  <div class="text-xs text-slate-700 space-y-2 bg-white p-3 rounded-xl border border-slate-200/80">
                    <div><strong class="text-slate-900">الصف الثاني:</strong> ${escapeHtml(t.g2_elective_rule)}</div>
                    <div><strong class="text-slate-900">الصف الثالث:</strong> ${escapeHtml(t.g3_core_subjects)}</div>
                    <div><strong class="text-teal-800">الكليات المستهدفة:</strong> ${escapeHtml(t.target_colleges)}</div>
                  </div>
                </div>
                <div class="pt-4 mt-3 border-t border-slate-200 flex gap-2">
                  <button type="button" onclick="BaccApp.openStageWithTrack('grade_2', '${t.id}')" class="flex-1 bg-teal-700 hover:bg-teal-800 text-white text-xs font-bold py-2.5 rounded-xl transition">مواد 2 ثانوي</button>
                  <button type="button" onclick="BaccApp.openStageWithTrack('grade_3', '${t.id}')" class="flex-1 bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold py-2.5 rounded-xl transition">مواد 3 ثانوي</button>
                </div>
              </div>
            `
              )
              .join('')}
          </div>
        </div>
      </section>

      <section id="bacc-calculator-sec" class="max-w-7xl mx-auto px-4 sm:px-6 py-10">
        <div class="bg-gradient-to-br from-slate-900 via-slate-800 to-teal-950 text-white rounded-3xl p-6 sm:p-8 shadow-xl border border-teal-500/30">

    }

    const allLessons = details.all_lessons || [];
    let activeLesson = allLessons.find(l => l.id === AppState.selectedLessonId) || allLessons[0] || null;
    if (activeLesson && AppState.selectedLessonId !== activeLesson.id) {
      AppState.selectedLessonId = activeLesson.id;
    }

    return `
      <div class="max-w-7xl mx-auto px-4 sm:px-6 py-8 space-y-6">
        <div class="bg-white rounded-3xl p-6 border border-slate-200 shadow-sm">

                <button type="button" onclick="BaccApp.openStage('${details.stage_id}')" class="hover:text-teal-700 font-bold">
                  ${escapeHtml(details.stage ? details.stage.name : 'المرحلة الدراسية')}
                </button>

                <span class="text-teal-700 font-bold">${escapeHtml(details.category)}</span>

                <span class="bg-slate-100 px-2.5 py-1 rounded-lg font-bold">الدرجة النهائية: ${details.max_grade} درجة</span>

                  details.is_unlocked
                    ? `<span class="bg-emerald-100 text-emerald-900 px-2.5 py-1 rounded-lg font-bold">✓ جميع دروس المادة مفتوحة لك</span>`
                    : `<button type="button" onclick="BaccApp.startSubjectCheckout('${details.id}')" class="bg-amber-500 hover:bg-amber-400 text-slate-950 px-3 py-1 rounded-lg font-extrabold">🔓 اشترك في المادة (${details.price_egp} ج.م)</button>`
                }
              </div>
            </div>

            <div class="bg-slate-50 rounded-2xl p-4 border border-slate-200 min-w-[260px] space-y-2">

              ${

                          isSelected

      AppState.lessonTab === tKey

        : 'bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold px-4 py-2.5 rounded-xl text-xs sm:text-sm transition';

    let tabBodyHtml = '';
    if (AppState.lessonTab === 'video') {
      tabBodyHtml = `
