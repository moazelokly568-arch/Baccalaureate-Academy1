  <script>
// ============================================================================
// Baccalaureate Academy - Supabase Cloud, Auth & Storage Connector (Phases 2-4)
// ملاحظة أمنية: لا يتم أبداً تضمين Service Role Key في ملفات الواجهة الأمامية
// ============================================================================
(function(global) {
  const SUPABASE_CONFIG_KEY = 'bacc_supabase_cloud_config_v1';
  const STORAGE_BUCKETS_KEY = 'bacc_supabase_storage_objects_v2';

  function getCloudConfig() {
    try {
      const raw = localStorage.getItem(SUPABASE_CONFIG_KEY);
      if (!raw) return { url: '', anonKey: '', enabled: false };
      return JSON.parse(raw);
    } catch (e) {
      return { url: '', anonKey: '', enabled: false };
    }
  }

  function saveCloudConfig(url, anonKey, enabled) {
    try {
      const cfg = {
        url: (url || '').trim(),
        anonKey: (anonKey || '').trim(),
        enabled: !!enabled,
        updatedAt: new Date().toISOString()
      };
      localStorage.setItem(SUPABASE_CONFIG_KEY, JSON.stringify(cfg));
      return cfg;
    } catch (e) {
      return null;
    }
  }

  function loadStorageObjects() {
    try {
      const raw = localStorage.getItem(STORAGE_BUCKETS_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {
      // ignore
    }
    return [
      {
        id: 'obj_pdf_g1_sci_1',
        bucket: 'course-materials',
        path: 'grade_1/sub_g1_integrated_sci/crs_g1_sci/water_properties_summary.pdf',
        fileName: 'مذكرة الدرس الأول - الخواص الفيزيائية والكيميائية للماء.pdf',
        mimeType: 'application/pdf',
        sizeBytes: 428500,
        isProtected: false,
        contentPreview: 'ملخص تجريبي: جزيء الماء يتكون من ذرة أكسجين مرتبطة بذرتي هيدروجين بزاوية 104.5 درجة...'
      },
      {
        id: 'obj_pdf_g2_ar_1',
        bucket: 'course-materials',
        path: 'grade_2/sub_g2_arabic/crs_g2_ar/arabic_unit1_notes.pdf',
        fileName: 'كتاب التقييمات والملخص الشامل - لغة عربية 2 ثانوي بكالوريا.pdf',
        mimeType: 'application/pdf',
        sizeBytes: 615200,
        isProtected: false,
        contentPreview: 'مواضع اقتران جواب الشرط بالفاء وجوباً: اسمية طلبية وبجامد وبما ولن وقد وبالتسويف...'
      },
      {
        id: 'obj_pdf_g3_bio_1',
        bucket: 'course-materials',
        path: 'grade_3/sub_g3_bio_adv/crs_g3_bio/molecular_biology_adv.pdf',
        fileName: 'مذكرة المستوى الرفيع في الأحياء - الباب الأول والثاني 3ث.pdf',
        mimeType: 'application/pdf',
        sizeBytes: 892000,
        isProtected: true,
        contentPreview: 'ملخص قوانين القطعة العضلية (الساركومير) وتضاعف الـ DNA للمستوى المتقدم...'
      }
    ];
  }

  function saveStorageObjects(list) {
    try {
      localStorage.setItem(STORAGE_BUCKETS_KEY, JSON.stringify(list));
    } catch (e) {
      // ignore
    }
  }

  global.BaccSupabaseConnector = {
    getCloudConfig,
    saveCloudConfig,

    async testConnection(url, anonKey) {
      if (!url || !anonKey) {
        return { ok: false, message: 'يرجى إدخال رابط مشروع Supabase ومفتاح Anon Public Key أولاً.' };
      }
      if (!url.startsWith('https://') || !url.includes('.supabase.co')) {
        return { ok: false, message: 'صيغة رابط Supabase غير صحيحة (يجب أن تنتهي بـ .supabase.co).' };
      }
      return {
        ok: true,
        message: 'تم التحقق من إعدادات الربط السحابي بـ Supabase وتفعيل المزامنة الهجينة مع سياسات RLS وSupabase Storage.'
      };
    },

    // Supabase Storage service: organizes files by stage_id/subject_id/course_id/filename
    // and generates time-limited signed URLs for paid/protected content
    storage: {
      listFiles(filters = {}) {
        let items = loadStorageObjects();
        if (filters.bucket) items = items.filter(x => x.bucket === filters.bucket);
        if (filters.pathPrefix) items = items.filter(x => x.path.startsWith(filters.pathPrefix));
        return items;
      },

      uploadFile({ bucket = 'course-materials', stageId, subjectId, courseId, fileName, mimeType, contentText, isProtected }) {
        if (mimeType && mimeType.startsWith('video/') && mimeType !== 'video/external-link') {
          throw new Error('STORAGE_POLICY: لا يتم تخزين ملفات الفيديو الكبيرة مباشرة داخل قاعدة البيانات؛ استخدم خدمة استضافة فيديو ورابط البث الآمن.');
        }
        const safeStage = stageId || 'general';
        const safeSub = subjectId || 'general';
        const safeCrs = courseId || 'general';
        const cleanName = String(fileName || 'attachment.pdf').replace(/[^a-zA-Z0-9._\u0600-\u06FF-]/g, '_');
        const path = `${safeStage}/${safeSub}/${safeCrs}/${Date.now()}_${cleanName}`;
        const items = loadStorageObjects();
        const obj = {
          id: 'obj_' + Date.now() + '_' + Math.floor(Math.random() * 1000),
          bucket,
          path,
          fileName: fileName || cleanName,
          mimeType: mimeType || 'application/pdf',
          sizeBytes: (contentText ? contentText.length : 1024) * 12,
          isProtected: !!isProtected,
          contentPreview: contentText || 'مرفق تعليمي مخزن في Supabase Storage',
          createdAt: new Date().toISOString().substring(0, 16)
        };
        items.unshift(obj);
        saveStorageObjects(items);
        return obj;
      },

      createSignedUrl(storagePath, expiresInSeconds = 3600, sessionToken = '') {
        if (!sessionToken) {
          throw new Error('STORAGE_RLS_DENIED: يتطلب إنشاء رابط موقّع (Signed URL) للمحتوى المحمي جلسة مستخدم مصرح له.');
        }
        const exp = Math.floor(Date.now() / 1000) + expiresInSeconds;
        const sig = btoa(unescape(encodeURIComponent(storagePath + '::' + exp + '::' + sessionToken))).substring(0, 28);
        return `https://storage.baccalaureate.academy/object/sign/course-materials/${encodeURIComponent(storagePath)}?token=${sig}&exp=${exp}`;
      }
    }
  };
})(window);

        const tch = st.teachers.find(t => t.id === sub.teacher_id);
        st.courses.push({
          id: 'crs_' + sub.id,
          title: 'الكورس الشامل في ' + sub.name + ' (تجريبي)',
          subject_id: sub.id,
          stage_id: sub.stage_id,
          teacher_id: sub.teacher_id || 'tch_1',
          teacher_name: tch ? tch.name : 'خبير المادة',
          image_url: sub.image_url,
          description: sub.description + ' — (بيانات تجريبية اختبارية للمنصة).',

          is_premium: !!sub.is_premium,

        if (crs) u.course_id = crs.id;
      }
    });

    st.lessons.forEach(l => {
      if (!l.course_id) {
        const crs = st.courses.find(c => c.subject_id === l.subject_id);
        if (crs) l.course_id = crs.id;
      }
      if (!l.review_status) l.review_status = 'approved';
      if (l.is_published === undefined) l.is_published = true;
      if (!l.content) l.content = l.video_summary || '';
    });

    // Normalize Questions table from exams
    st.exams.forEach(ex => {
      if (!ex.published_at) ex.published_at = '2026-10-20';
      if (!ex.course_id) {
        const crs = st.courses.find(c => c.subject_id === ex.subject_id);
        if (crs) ex.course_id = crs.id;
      }
      if (Array.isArray(ex.questions)) {
        ex.questions.forEach((q, idx) => {
          const qGlobalId = ex.id + '_' + q.id;
          if (!st.questions.some( existingQ => existingQ.id === qGlobalId )) {
            st.questions.push({
              id: qGlobalId,
              local_id: q.id,
              exam_id: ex.id,
              question_text: q.text,
              question_type: q.type || 'mcq',
              options: q.options || [],
              correct_answer: String(q.correctAnswer !== undefined ? q.correctAnswer : '0'),
              accepted_answers: q.acceptedAnswers || [String(q.correctAnswer || '')],
              marks: Number(q.marks || 20),
              explanation: q.explanation || '',
              order_index: idx + 1
            });
          }
        });
      }
    });

    // Keep `results` and `exam_submissions` synchronized
    if (!st.results) st.results = st.exam_submissions || [];
    st.exam_submissions = st.results;

    // Keep `progress` and `lesson_progress` synchronized, with `last_position_seconds`
    if (!st.progress) st.progress = st.lesson_progress || [];
    st.progress.forEach(p => {
      if (p.last_position_seconds === undefined) p.last_position_seconds = p.completed ? 1200 : 180;
      if (p.progress_percent === undefined) p.progress_percent = p.completed ? 100 : 35;
      if (!p.course_id) {
        const les = st.lessons.find(l => l.id === p.lesson_id);
        if (les) p.course_id = les.course_id;
      }
    });
    st.lesson_progress = st.progress;
  }

  function loadDatabase() {
    try {
      const saved = localStorage.getItem(DB_STORAGE_KEY);
      if (saved) {
        const parsed = JSON.parse(saved);
        if (parsed && parsed.meta && parsed.stages && parsed.subjects && parsed.users) {
          _state = parsed;
        }
      }
    } catch (e) {
      // ignore
    }
    if (!_state) {
      _state = clone(global.BACC_INITIAL_SEED);
    }
    normalizeDatabaseTables(_state);
    persistDatabase();

    try {
      const savedSession = localStorage.getItem(SESSION_STORAGE_KEY);
      if (savedSession) {
        const parsedSession = JSON.parse(savedSession);
        if (parsedSession && parsedSession.userId) {
          const found = _state.users.find(u => u.id === parsedSession.userId && u.status === 'active');
          if (found) {
            _session = {
              token: parsedSession.token,
              userId: found.id,
              role: found.role,
              email: found.email,
              loginAt: parsedSession.loginAt
            };
          }
        }
      }
    } catch (e) {
      // ignore
    }
  }

  function persistDatabase() {
    try {
      localStorage.setItem(DB_STORAGE_KEY, JSON.stringify(_state));
    } catch (e) {
      // ignore
    }
  }

  function persistSession() {
    try {
      if (_session) {
        localStorage.setItem(SESSION_STORAGE_KEY, JSON.stringify(_session));
      } else {
        localStorage.removeItem(SESSION_STORAGE_KEY);
      }
    } catch (e) {
      // ignore
    }
  }

  function logAudit(action, severity = 'info') {
    if (!_state.admin_only_vault) return;
    const actor = _session ? _session.email : 'system';
    const now = new Date();
    const ts = now.toISOString().replace('T', ' ').substring(0, 16);
    _state.admin_only_vault.audit_logs.unshift({
      id: 'aud_' + Date.now() + '_' + Math.floor(Math.random() * 1000),
      timestamp: ts,
      actor,
      action,
      severity
    });
    if (_state.admin_only_vault.audit_logs.length > 120) {
      _state.admin_only_vault.audit_logs.length = 120;
    }
    persistDatabase();
  }

  // ============================================================================
  // ROW LEVEL SECURITY (RLS) & RBAC ENFORCEMENT ENGINE
  // ============================================================================
  function assertAuthenticatedRLS() {
    if (!_session || !_session.userId || !_session.token) {
      throw new Error('RLS_AUTH_REQUIRED: يجب تسجيل الدخول بجلسة صالحة لتنفيذ هذا الإجراء.');
    }
    const user = _state.users.find(u => u.id === _session.userId);
    if (!user || user.status !== 'active') {
      throw new Error('RLS_ACCOUNT_SUSPENDED: الحساب غير نشط أو غير موجود.');
    }
    return user;
  }

  function assertAdminRLS() {
    const user = assertAuthenticatedRLS();
    if (user.role !== 'admin') {
      logAudit('منع محاولة وصول غير مصرح بها إلى لوحة أو صلاحيات المدير من: ' + user.email + ' (' + user.role + ')', 'security');
      throw new Error('RLS_ADMIN_DENIED: صلاحيات قاعدة البيانات تمنع غير المدير (Admin) من الوصول إلى هذا المورد.');
    }
    return user;
  }

  function assertTeacherOrAdminRLS() {
    const user = assertAuthenticatedRLS();
    if (user.role !== 'teacher' && user.role !== 'admin') {
      logAudit('منع طالب من محاولة فتح لوحة المدرس: ' + user.email, 'security');
      throw new Error('RLS_TEACHER_ACCESS_DENIED: يُمنع الطلاب من الدخول إلى لوحة تحكم المدرسين أو أدواتهم.');
    }
    return user;
  }

  function assertApprovedTeacherOrAdminRLS() {
    const user = assertTeacherOrAdminRLS();
    if (user.role === 'teacher' && user.approval_status !== 'approved') {
      logAudit('منع مدرس غير معتمد بعد من نشر محتوى: ' + user.email, 'security');
      throw new Error('RLS_TEACHER_NOT_APPROVED: حساب المدرس قيد المراجعة حالياً؛ يجب موافقة المدير قبل نشر الدروس أو الكورسات أو الامتحانات.');
    }
    return user;
  }

  function assertStudentStageAccessRLS(targetStageId) {
    if (!_session) return true; // Public catalog browsing
    const user = _state.users.find(u => u.id === _session.userId);
    if (!user) return true;
    if (user.role === 'admin' || user.role === 'teacher') return true;
    // If student has VIP all-stages plan, allow; otherwise enforce student's stage
    if (user.subscription_plan === 'plan_vip') return true;
    const studentStage = user.stage_id || user.grade_id;
    if (studentStage && targetStageId && studentStage !== targetStageId) {
      throw new Error('RLS_STAGE_ISOLATION: لا يُسمح للطالب بالوصول إلى محتوى مرحلة دراسية أخرى (' + targetStageId + ') غير مرحلته المسجلة (' + studentStage + ') دون تصريح.');
    }
    return true;
  }

  function sanitizeUserRecord(u) {
    if (!u) return null;
    const copy = clone(u);
    delete copy.password_hash;
    return copy;
  }

  function hasSubjectAccess(subjectId) {
    const sub = _state.subjects.find(s => s.id === subjectId);
    if (!sub) return false;
    if (!sub.is_premium || Number(sub.price_egp) === 0) return true;
    if (!_session) return false;
    const user = _state.users.find(u => u.id === _session.userId);
    if (!user) return false;
    if (user.role === 'admin' || user.role === 'teacher') return true;

      s =>
        s.student_id === user.id &&

    requestPasswordReset(email) {
      const cleanEmail = String(email || '').trim().toLowerCase();
      const user = _state.users.find(u => u.email.toLowerCase() === cleanEmail);
      if (!user) {
        return { ok: false, error: 'لم يتم العثور على حساب مسجل بهذا البريد الإلكتروني.' };
      }
      const resetCode = 'RST-' + sha256Pure(cleanEmail + '::' + Date.now()).substring(0, 8).toUpperCase();
      _resetTokens[cleanEmail] = {
        code: resetCode,
        expiresAt: Date.now() + 15 * 60 * 1000
      };
      logAudit('طلب استعادة كلمة المرور للحساب: ' + cleanEmail, 'security');
      return {
        ok: true,
        email: cleanEmail,
        resetCode, // Returned for interactive verification in sandbox
        message: 'تم إصدار رمز استعادة كلمة المرور الآمن عبر Supabase Auth.'
      };
    },

    confirmPasswordReset(email, resetCode, newPassword, confirmNewPassword) {
      const cleanEmail = String(email || '').trim().toLowerCase();
      const entry = _resetTokens[cleanEmail];
      if (!entry || entry.code !== String(resetCode || '').trim()) {
        return { ok: false, error: 'رمز التحقق لاستعادة كلمة المرور غير صحيح أو منتهي الصلاحية.' };
      }
      if (!newPassword || String(newPassword).length < 6) {
        return { ok: false, error: 'كلمة المرور الجديدة يجب ألا تقل عن 6 أحرف.' };
      }
      if (confirmNewPassword !== undefined && newPassword !== confirmNewPassword) {
        return { ok: false, error: 'كلمة المرور الجديدة وتأكيدها غير متطابقتين.' };
      }
      const user = _state.users.find(u => u.email.toLowerCase() === cleanEmail);
      if (!user) return { ok: false, error: 'المستخدم غير موجود.' };
      user.password_hash = hashCredentials(cleanEmail, newPassword);
      delete _resetTokens[cleanEmail];
      persistDatabase();
      logAudit('تمت إعادة تعيين كلمة المرور بنجاح للحساب: ' + cleanEmail, 'security');
      return { ok: true, message: 'تم تحديث كلمة المرور بنجاح. يمكنك الآن تسجيل الدخول.' };
    },

    logout() {
      const prevEmail = _session ? _session.email : null;
      if (prevEmail) logAudit('تسجيل خروج آمن وإغلاق الجلسة: ' + prevEmail, 'info');
      _session = null;
      persistSession();
      return { ok: true, loggedOutEmail: prevEmail };
    },

    // Update profile with strict RLS user isolation (User cannot modify another user's profile or elevate role)
    updateUserProfile(targetUserId, updates) {
      const currentUser = assertAuthenticatedRLS();
      const effectiveTargetId = targetUserId || currentUser.id;
      if (currentUser.id !== effectiveTargetId && currentUser.role !== 'admin') {
        logAudit('محاولة غير مصرح بها من ' + currentUser.email + ' لتعديل بيانات المستخدم ' + effectiveTargetId, 'security');
        throw new Error('RLS_USER_ISOLATION: لا يستطيع أي مستخدم تعديل البيانات الشخصية لمستخدم آخر.');
      }
      const target = _state.users.find(u => u.id === effectiveTargetId);
      if (!target) return { ok: false, error: 'المستخدم غير موجود.' };
      if (updates.full_name) target.full_name = String(updates.full_name).trim();
      if (updates.avatar_url) target.avatar_url = String(updates.avatar_url).trim();
      if (updates.stage_id || updates.grade_id) {
        const stg = updates.stage_id || updates.grade_id;
        target.stage_id = stg;
        target.grade_id = stg;
      }
      if (updates.track_id) target.track_id = updates.track_id;
      if (updates.phone) target.phone = String(updates.phone).trim();
      if (updates.governorate) target.governorate = updates.governorate;
      if (updates.specialty && target.role === 'teacher') target.specialty = updates.specialty;
      // Non-admin can NEVER alter `role` or `approval_status`
      if (currentUser.role === 'admin') {
        if (updates.role) target.role = updates.role;
        if (updates.approval_status) target.approval_status = updates.approval_status;
      }
      persistDatabase();
      logAudit('تحديث الملف الشخصي للمستخدم: ' + target.email, 'info');
      return { ok: true, user: sanitizeUserRecord(target) };
    },

    updateStudentProfile(updates) {
      const user = assertAuthenticatedRLS();
      return this.updateUserProfile(user.id, updates);
    },

    // --- Catalog Reads: Stages, Tracks, Subjects, Courses, Units, Lessons ---
    getMeta() {
      return {
        ...clone(_state.meta),
        demo_disclaimer: _state.demo_disclaimer
      };
    },

    getStages() {
      return clone(_state.stages).sort((a, b) => a.order_index - b.order_index);
    },

    getTracks() {
      return clone(_state.tracks);
    },

    getTeachers() {
      return clone(_state.teachers).filter(t => t.approval_status !== 'rejected');
    },

    getSubjects(filters = {}) {
      let list = clone(_state.subjects);
      const currentUser = this.getCurrentUser();

      // Hide unpublished subjects from non-admins
      if (!currentUser || currentUser.role !== 'admin') {
        list = list.filter(s => s.is_published !== false);
      }

      // Enforce Stage Isolation if strictStudentStage is requested or when student queries another stage directly
      if (filters.enforceStudentStage && currentUser && currentUser.role === 'student') {
        const stuStage = currentUser.stage_id || currentUser.grade_id;
        if (filters.stage_id && filters.stage_id !== 'all' && filters.stage_id !== stuStage && currentUser.subscription_plan !== 'plan_vip') {
          assertStudentStageAccessRLS(filters.stage_id);
        }
        list = list.filter(s => s.stage_id === stuStage);
      } else if (filters.stage_id && filters.stage_id !== 'all') {
        list = list.filter(s => s.stage_id === filters.stage_id);
      }

      if (filters.track_id && filters.track_id !== 'all') {
        list = list.filter(s => s.track_ids.includes(filters.track_id) || s.track_ids.includes('track_general'));
      }
      if (filters.teacher_id && filters.teacher_id !== 'all') {
        list = list.filter(s => s.teacher_id === filters.teacher_id);
      }

      return list.map(sub => {
        const teacher = _state.teachers.find(t => t.id === sub.teacher_id || t.user_id === sub.teacher_id);
        const courses = _state.courses.filter(c => c.subject_id === sub.id && (c.review_status === 'approved' || (currentUser && currentUser.role === 'admin')));
        const units = _state.units.filter(u => u.subject_id === sub.id);
        const lessons = _state.lessons.filter(l => l.subject_id === sub.id && l.review_status === 'approved');
        const exams = _state.exams.filter(e => e.subject_id === sub.id);
        return {
          ...sub,
          teacher_name: teacher ? teacher.name : 'هيئة تدريس الأكاديمية',
          courses_count: courses.length,
          units_count: units.length,
          lessons_count: lessons.length,
          exams_count: exams.length,
          is_unlocked: hasSubjectAccess(sub.id)
        };
      });
    },

    // --- Phase 4: Courses System ---
    getCourses(filters = {}) {
      const currentUser = this.getCurrentUser();
      let list = clone(_state.courses);

      // Only show approved & published courses to students/guests
      if (!currentUser || currentUser.role === 'student') {
        list = list.filter(c => c.is_published !== false && c.review_status === 'approved');
      }

      if (filters.enforceStudentStage && currentUser && currentUser.role === 'student') {
        const stuStage = currentUser.stage_id || currentUser.grade_id;
        if (filters.stage_id && filters.stage_id !== 'all' && filters.stage_id !== stuStage && currentUser.subscription_plan !== 'plan_vip') {
          assertStudentStageAccessRLS(filters.stage_id);
        }
        list = list.filter(c => c.stage_id === stuStage);
      } else if (filters.stage_id && filters.stage_id !== 'all') {
        list = list.filter(c => c.stage_id === filters.stage_id);
      }

      if (filters.subject_id && filters.subject_id !== 'all') {
        list = list.filter(c => c.subject_id === filters.subject_id);
      }
      if (filters.teacher_id && filters.teacher_id !== 'all') {
        list = list.filter(c => c.teacher_id === filters.teacher_id);
      }
      if (filters.search) {
        const q = String(filters.search).trim().toLowerCase();
        list = list.filter(
          c =>
            c.title.toLowerCase().includes(q) ||
            c.description.toLowerCase().includes(q) ||
            (c.teacher_name || '').toLowerCase().includes(q)
        );
      }

      return list.map(crs => {
        const sub = _state.subjects.find(s => s.id === crs.subject_id);
        const stg = _state.stages.find(st => st.id === crs.stage_id);
        const tch = _state.teachers.find(t => t.id === crs.teacher_id || t.user_id === crs.teacher_id);
        const units = _state.units.filter(u => u.course_id === crs.id || u.subject_id === crs.subject_id);
        const lessons = _state.lessons
          .filter(l => (l.course_id === crs.id || l.subject_id === crs.subject_id) && l.review_status === 'approved')
          .sort((a, b) => a.order_index - b.order_index);

        let completedCount = 0;
        let lastLessonId = null;
        if (currentUser) {
          const myProg = _state.progress.filter(
            p => p.student_id === currentUser.id && lessons.some(l => l.id === p.lesson_id) && p.completed
          );
          completedCount = myProg.length;
          const enr = _state.course_enrollments.find(e => e.student_id === currentUser.id && e.course_id === crs.id);
          if (enr && enr.last_lesson_id) lastLessonId = enr.last_lesson_id;
        }
        const progressPercent = lessons.length > 0 ? Math.round((completedCount / lessons.length) * 100) : 0;

        return {
          ...crs,
          subject_name: sub ? sub.name : 'مادة البكالوريا',
          stage_name: stg ? stg.name : '',
          teacher_name: tch ? tch.name : crs.teacher_name || 'خبير المادة',
          units_count: units.length,
          lessons_count: lessons.length,
          completed_count: completedCount,
          progress_percent: progressPercent,
          last_lesson_id: lastLessonId || (lessons[0] ? lessons[0].id : null),
          is_unlocked: !crs.is_premium || hasSubjectAccess(crs.subject_id)
        };
      });
    },

    getCourseDetails(courseId, options = {}) {
      const crs = _state.courses.find(c => c.id === courseId);
      if (!crs) return null;
      if (options.enforceStageRLS) {
        assertStudentStageAccessRLS(crs.stage_id);
      }
      const subDetails = this.getSubjectDetails(crs.subject_id, options);
      const enrichedCourse = this.getCourses().find(c => c.id === courseId) || crs;
      return {
        ...enrichedCourse,
        subjectDetails: subDetails
      };
    },

    getSubjectDetails(subjectId, options = {}) {
      const sub = _state.subjects.find(s => s.id === subjectId);
      if (!sub) return null;
      if (options.enforceStageRLS) {
        assertStudentStageAccessRLS(sub.stage_id);
      }
      const teacher = _state.teachers.find(t => t.id === sub.teacher_id || t.user_id === sub.teacher_id);
      const stage = _state.stages.find(st => st.id === sub.stage_id);
      const course = _state.courses.find(c => c.subject_id === subjectId) || null;
      const units = clone(_state.units)
        .filter(u => u.subject_id === subjectId)
        .sort((a, b) => a.order_index - b.order_index);
      const unlocked = hasSubjectAccess(subjectId);
      const currentUserId = _session ? _session.userId : null;
      const isAdminOrTeacher = _session && (_session.role === 'admin' || _session.role === 'teacher');

      const allLessons = clone(_state.lessons)
        .filter(l => l.subject_id === subjectId && (isAdminOrTeacher || (l.review_status === 'approved' && l.is_published !== false)))
        .sort((a, b) => a.order_index - b.order_index)
        .map((les, idx, arr) => {
          const canView = unlocked || les.is_free_preview;
          const prog = currentUserId
            ? _state.progress.find(p => p.student_id === currentUserId && p.lesson_id === les.id)
            : null;
          const attachments = clone(_state.lesson_attachments).filter(a => a.lesson_id === les.id);
          const nextLes = arr[idx + 1] || null;
          const prevLes = arr[idx - 1] || null;
          return {
            id: les.id,
            unit_id: les.unit_id,
            course_id: les.course_id || (course ? course.id : null),
            subject_id: les.subject_id,
            title: les.title,
            order_index: les.order_index,
            duration_minutes: les.duration_minutes,
            is_free_preview: les.is_free_preview,
            review_status: les.review_status || 'approved',
            can_view: canView,
            completed: !!(prog && prog.completed),
            last_position_seconds: prog ? Number(prog.last_position_seconds || 0) : 0,
            quiz_score: prog ? prog.quiz_score : null,
            student_notes: prog ? prog.notes : '',
            video_url: canView ? les.video_url : '',
            video_summary: canView ? les.video_summary : 'هذا الدرس متاح للمشتركين في المادة أو باقة المسار.',
            pdf_title: les.pdf_title,
            pdf_content: canView ? les.pdf_content : '',
            quiz_questions: canView ? les.quiz_questions : [],
            attachments: canView ? attachments : [],
            next_lesson_id: nextLes ? nextLes.id : null,
            prev_lesson_id: prevLes ? prevLes.id : null
          };
        });

      const completedCount = allLessons.filter(l => l.completed).length;
      const progressPercent = allLessons.length > 0 ? Math.round((completedCount / allLessons.length) * 100) : 0;

      // Determine resume lesson for student
      let resumeLessonId = allLessons[0] ? allLessons[0].id : null;
      if (currentUserId && course) {
        const enr = _state.course_enrollments.find(e => e.student_id === currentUserId && e.course_id === course.id);
        if (enr && enr.last_lesson_id && allLessons.some(l => l.id === enr.last_lesson_id)) {
          resumeLessonId = enr.last_lesson_id;
        } else {
          const firstIncomplete = allLessons.find(l => !l.completed);
          if (firstIncomplete) resumeLessonId = firstIncomplete.id;
        }
      }

      return {
        ...clone(sub),
        course: course ? clone(course) : null,
        teacher: teacher ? clone(teacher) : null,
        stage: stage ? clone(stage) : null,
        is_unlocked: unlocked,
        units: units.map(u => ({
          ...u,
          lessons: allLessons.filter(l => l.unit_id === u.id)
        })),
        all_lessons: allLessons,
        completed_count: completedCount,
        progress_percent: progressPercent,
        resume_lesson_id: resumeLessonId,
        exams: clone(_state.exams).filter(e => e.subject_id === subjectId)
      };
    },

    // --- Progress Tracking & Resume Learning (Phase 2 & Phase 4) ---
    saveStudentLessonProgress({ targetStudentId, lessonId, completed, lastPositionSeconds, notesText, quizScore }) {
      const user = assertAuthenticatedRLS();
      // RLS Guard: Student can NEVER modify another student's progress
      if (targetStudentId && targetStudentId !== user.id && user.role !== 'admin') {
        logAudit('منع الطالب ' + user.email + ' من محاولة تعديل تقدم طالب آخر (' + targetStudentId + ')', 'security');
        throw new Error('RLS_PROGRESS_ISOLATION: لا يستطيع الطالب تعديل تقدم طالب آخر.');
      }
      const studentId = targetStudentId || user.id;
      const lesson = _state.lessons.find(l => l.id === lessonId);
      if (!lesson) throw new Error('الدرس غير موجود.');
      if (!lesson.is_free_preview && !hasSubjectAccess(lesson.subject_id)) {
        throw new Error('RLS_CONTENT_LOCKED: يرجى الاشتراك في المادة أولاً لحفظ تقدم هذا الدرس.');
      }

      let prog = _state.progress.find(p => p.student_id === studentId && p.lesson_id === lessonId);
      if (!prog) {
        prog = {
          id: 'prog_' + Date.now() + '_' + Math.floor(Math.random() * 1000),
          student_id: studentId,
          lesson_id: lessonId,
          course_id: lesson.course_id || ('crs_' + lesson.subject_id),
          subject_id: lesson.subject_id,
          completed: completed !== undefined ? !!completed : true,
          progress_percent: completed ? 100 : 50,
          last_position_seconds: lastPositionSeconds !== undefined ? Number(lastPositionSeconds) : 0,
          quiz_score: quizScore !== undefined ? quizScore : null,
          notes: notesText !== undefined ? notesText : '',
          completed_at: new Date().toISOString().substring(0, 10)
        };
        _state.progress.push(prog);
      } else {
        if (completed !== undefined) {
          prog.completed = !!completed;
          prog.progress_percent = prog.completed ? 100 : 50;
        }
        if (lastPositionSeconds !== undefined) {
          prog.last_position_seconds = Number(lastPositionSeconds);
        }
        if (notesText !== undefined) {
          prog.notes = notesText;
        }
        if (quizScore !== undefined && quizScore !== null) {
          prog.quiz_score = Math.max(Number(prog.quiz_score || 0), Number(quizScore));
          prog.completed = true;
          prog.progress_percent = 100;
        }
      }

      // Update Course_Enrollments `last_lesson_id` so student can resume where they left off
      const courseId = lesson.course_id || ('crs_' + lesson.subject_id);
      let enr = _state.course_enrollments.find(e => e.student_id === studentId && e.course_id === courseId);
      if (!enr) {
        enr = {
          id: 'enr_' + Date.now(),
          student_id: studentId,
          course_id: courseId,
          last_lesson_id: lessonId,
          enrolled_at: new Date().toISOString().substring(0, 10)
        };
        _state.course_enrollments.push(enr);
      } else {
        enr.last_lesson_id = lessonId;
      }

      persistDatabase();
      return clone(prog);
    },

    toggleLessonCompleted(lessonId, notesText, quizScore) {
      const user = assertAuthenticatedRLS();
      const existing = _state.progress.find(p => p.student_id === user.id && p.lesson_id === lessonId);
      const nextCompleted =
        quizScore !== undefined && quizScore !== null
          ? true
          : notesText !== undefined
          ? existing
            ? existing.completed
            : false
          : existing
          ? !existing.completed
          : true;
      return this.saveStudentLessonProgress({
        lessonId,
        completed: nextCompleted,
        notesText,
        quizScore
      });
    },

    // --- Exams, Questions & Immutable Results (Phase 2) ---
    getExams(filters = {}) {
      let list = clone(_state.exams);
      if (filters.stage_id && filters.stage_id !== 'all') {
        list = list.filter(e => e.stage_id === filters.stage_id);
      }
      if (filters.subject_id && filters.subject_id !== 'all') {
        list = list.filter(e => e.subject_id === filters.subject_id);
      }
      const userId = _session ? _session.userId : null;
      return list.map(ex => {
        const sub = _state.subjects.find(s => s.id === ex.subject_id);
        const stg = _state.stages.find(st => st.id === ex.stage_id);
        const mySubs = userId ? _state.results.filter(s => s.student_id === userId && s.exam_id === ex.id) : [];
        const highestScore = mySubs.length > 0 ? Math.max(...mySubs.map(s => Number(s.score))) : null;
        return {
          ...ex,
          subject_name: sub ? sub.name : '',
          stage_name: stg ? stg.name : '',
          questions_count: Array.isArray(ex.questions) ? ex.questions.length : 0,
          attempts_count: mySubs.length,
          highest_score: highestScore,
          can_access: !ex.is_premium || hasSubjectAccess(ex.subject_id)
        };
      });
    },

    submitExamAttempt(examId, userAnswers, opportunityLabel) {
      const user = assertAuthenticatedRLS();
      const exam = _state.exams.find(e => e.id === examId);
      if (!exam) throw new Error('الاختبار غير موجود.');
      if (exam.is_premium && !hasSubjectAccess(exam.subject_id)) {
        throw new Error('RLS_EXAM_LOCKED: هذا الاختبار يتطلب اشتراكاً فعالاً في المادة أو باقة المسار.');
      }

      let earnedMarks = 0;
      const totalMarks = Number(exam.total_marks) || 100;
      const detailedReview = exam.questions.map(q => {
        const rawAns = userAnswers[q.id];
        let isCorrect = false;
        if (q.type === 'mcq' || q.type === 'tf') {
          isCorrect = String(rawAns) === String(q.correctAnswer);
        } else if (q.type === 'short') {
          const cleanStudent = String(rawAns || '').trim().toLowerCase();
          const accepted = (q.acceptedAnswers || [q.correctAnswer]).map(a => String(a).trim().toLowerCase());
          isCorrect = accepted.includes(cleanStudent);
        }
        const qMarks = Number(q.marks) || Math.round(totalMarks / exam.questions.length);
        if (isCorrect) earnedMarks += qMarks;
        return {
          questionId: q.id,
          text: q.text,
          type: q.type,
          options: q.options || [],
          studentAnswer: rawAns !== undefined ? rawAns : '',
          correctAnswer: q.correctAnswer,
          isCorrect,
          earned: isCorrect ? qMarks : 0,
          maxMarks: qMarks,
          explanation: q.explanation
        };
      });

      const prevAttempts = _state.results.filter(s => s.student_id === user.id && s.exam_id === examId);
      const attemptNumber = prevAttempts.length + 1;
      const percentage = Math.round((earnedMarks / totalMarks) * 100);
      const nowStr = new Date().toISOString().replace('T', ' ').substring(0, 16);

      const submission = {
        id: 'subm_' + Date.now(),
        student_id: user.id,
        exam_id: 'ex_' + Date.now(),
        subject_id: exam.subject_id,
        attempt_number: attemptNumber,
        opportunity_label: opportunityLabel || (attemptNumber === 1 ? 'الفرصة الأولى الأساسية' : 'الفرصة الثانية التحسينية'),
        score: earnedMarks,
        total_marks: totalMarks,
        percentage,
        submitted_at: nowStr
      };
      _state.results.unshift(submission);
      persistDatabase();

      const allScores = _state.results
        .filter(s => s.student_id === user.id && s.exam_id === examId)
        .map(s => Number(s.score));
      const highestOfficialScore = Math.max(...allScores);

      return {
        submission: clone(submission),
        highestOfficialScore,
        passed: earnedMarks >= exam.pass_marks,
        detailedReview
      };
    },

    // Phase 2 Security Rule: No user can directly modify student exam grades/results!
    directModifyResult(resultId, newScore) {
      logAudit('منع محاولة تعديل مباشر لنتيجة امتحان (' + resultId + ') إلى الدرجة ' + newScore, 'security');
      throw new Error('RLS_IMMUTABLE_RESULTS: تمنع سياسات أمان قاعدة البيانات تعديل درجات أو نتائج الطلاب مباشرة بعد رصدها.');
    },

    // --- Student Dashboard ---
    getStudentDashboardData() {
      const user = assertAuthenticatedRLS();
      const stageId = user.stage_id || user.grade_id || 'grade_2';
      const stage = _state.stages.find(s => s.id === stageId) || _state.stages[1];
      const track = _state.tracks.find(t => t.id === user.track_id) || _state.tracks[1];
      const mySubjects = this.getSubjects({ stage_id: stageId, track_id: user.track_id });
      const myCourses = this.getCourses({ stage_id: stageId });
      const myProgress = _state.progress.filter(p => p.student_id === user.id && p.completed);
      const mySubmissions = clone(_state.results)
        .filter(s => s.student_id === user.id)
        .map(s => {
          const ex = _state.exams.find(e => e.id === s.exam_id);
          const sub = _state.subjects.find(sb => sb.id === s.subject_id);
          return {
            ...s,
            exam_title: ex ? ex.title : 'اختبار إلكتروني',
            subject_name: sub ? sub.name : ''
          };
        });
      const mySubscriptions = clone(_state.subscriptions)
        .filter(s => s.student_id === user.id)
        .map(s => {
          const pl = _state.subscription_plans.find(p => p.id === s.plan_id);
          const sb = _state.subjects.find(x => x.id === s.subject_id);
          return {
            ...s,
            plan_name: pl ? pl.name : 'باقة تعليمية',
            subject_name: sb ? sb.name : 'جميع مواد الباقة'
          };
        });

      const highestBySubject = {};
      mySubmissions.forEach(subm => {
        if (!highestBySubject[subm.subject_id] || subm.score > highestBySubject[subm.subject_id].score) {
          highestBySubject[subm.subject_id] = subm;
        }
      });

      const totalLessonsInStage = mySubjects.reduce((acc, s) => acc + s.lessons_count, 0);
      const completedInStage = mySubjects.reduce((acc, s) => {
        const count = myProgress.filter(p => p.subject_id === s.id).length;
        return acc + count;
      }, 0);
      const overallProgress = totalLessonsInStage > 0 ? Math.round((completedInStage / totalLessonsInStage) * 100) : 0;

      return {
        user: sanitizeUserRecord(user),
        stage: clone(stage),
        track: clone(track),
        courses: myCourses,
        subjects: mySubjects.map(s => {
          const done = myProgress.filter(p => p.subject_id === s.id).length;
          const pct = s.lessons_count > 0 ? Math.round((done / s.lessons_count) * 100) : 0;
          return {
            ...s,
            completed_lessons: done,
            progress_pct: pct,
            best_exam: highestBySubject[s.id] || null
          };
        }),
        submissions: mySubmissions,
        subscriptions: mySubscriptions,
        notifications: this.getNotifications(),
        overall_progress: overallProgress,
        completed_lessons_total: completedInStage,
        total_lessons_stage: totalLessonsInStage
      };
    },

    // ========================================================================
    // PHASE 3 & 4: TEACHER DASHBOARD & TEACHER CONTENT OPERATIONS
    // ========================================================================
    getTeacherDashboardData() {
      const user = assertTeacherOrAdminRLS();
      const assignedIds = user.assigned_subject_ids || [];
      const mySubjects = clone(_state.subjects).filter(
        s => user.role === 'admin' || assignedIds.includes(s.id) || s.teacher_id === user.teacher_ref_id || s.teacher_id === user.id
      );
      const mySubjectIds = mySubjects.map(s => s.id);
      const myCourses = clone(_state.courses).filter(
        c => user.role === 'admin' || mySubjectIds.includes(c.subject_id) || c.teacher_id === user.teacher_ref_id || c.teacher_id === user.id
      );
      const myLessons = clone(_state.lessons).filter(l => mySubjectIds.includes(l.subject_id));
      const myExams = clone(_state.exams).filter(e => mySubjectIds.includes(e.subject_id));
      const studentResults = clone(_state.results)
        .filter(r => mySubjectIds.includes(r.subject_id))
        .map(r => {
          const stu = _state.users.find(u => u.id === r.student_id);
          const ex = _state.exams.find(e => e.id === r.exam_id);
          const sb = _state.subjects.find(s => s.id === r.subject_id);
          return {
            ...r,
            student_name: stu ? stu.full_name : 'طالب',
            exam_title: ex ? ex.title : 'اختبار',
            subject_name: sb ? sb.name : ''
          };
        });

      return {
        teacher: sanitizeUserRecord(user),
        is_approved: user.role === 'admin' || user.approval_status === 'approved',
        subjects: mySubjects,
        courses: myCourses,
        lessons: myLessons,
        exams: myExams,
        student_results: studentResults,
        attachments: clone(_state.lesson_attachments).filter(a => mySubjectIds.includes(a.subject_id))
      };
    },

    upsertUnit(payload) {
      const actor = assertApprovedTeacherOrAdminRLS();
      const sub = _state.subjects.find(s => s.id === payload.subject_id) || _state.subjects[0];
      const crs = _state.courses.find(c => c.id === payload.course_id || c.subject_id === sub.id);
      let unit = _state.units.find(u => u.id === payload.id);
      if (unit) {
        unit.title = payload.title || unit.title;
        if (payload.order_index !== undefined) unit.order_index = Number(payload.order_index);
      } else {
        const existingUnits = _state.units.filter(u => u.subject_id === sub.id);
        unit = {
          id: 'u_' + Date.now() + '_' + Math.floor(Math.random() * 1000),
          subject_id: sub.id,
          course_id: crs ? crs.id : null,
          title: payload.title,
          order_index: payload.order_index ? Number(payload.order_index) : existingUnits.length + 1
        };
        _state.units.push(unit);
      }
      persistDatabase();
      logAudit('إضافة/تحديث وحدة تعليمية: ' + unit.title + ' بواسطة ' + actor.email, 'info');
      return clone(unit);
    },

    reorderUnit(unitId, direction) {
      assertApprovedTeacherOrAdminRLS();
      const unit = _state.units.find(u => u.id === unitId);
      if (!unit) throw new Error('الوحدة غير موجودة.');
      const siblings = _state.units
        .filter(u => u.subject_id === unit.subject_id)
        .sort((a, b) => a.order_index - b.order_index);
      const idx = siblings.findIndex(u => u.id === unitId);
      const swapIdx = direction === 'up' ? idx - 1 : idx + 1;
      if (swapIdx >= 0 && swapIdx < siblings.length) {
        const temp = siblings[idx].order_index;
        siblings[idx].order_index = siblings[swapIdx].order_index;
        siblings[swapIdx].order_index = temp;
        if (siblings[idx].order_index === siblings[swapIdx].order_index) {
          siblings.forEach((s, i) => (s.order_index = i + 1));
        }
        persistDatabase();
      }
      return clone(siblings);
    },

    reorderLesson(lessonId, direction) {
      assertApprovedTeacherOrAdminRLS();
      const lesson = _state.lessons.find(l => l.id === lessonId);
      if (!lesson) throw new Error('الدرس غير موجود.');
      const siblings = _state.lessons
        .filter(l => l.subject_id === lesson.subject_id)
        .sort((a, b) => a.order_index - b.order_index);
      const idx = siblings.findIndex(l => l.id === lessonId);
      const swapIdx = direction === 'up' ? idx - 1 : idx + 1;
      if (swapIdx >= 0 && swapIdx < siblings.length) {
        const temp = siblings[idx].order_index;
        siblings[idx].order_index = siblings[swapIdx].order_index;
        siblings[swapIdx].order_index = temp;
        if (siblings[idx].order_index === siblings[swapIdx].order_index) {
          siblings.forEach((s, i) => (s.order_index = i + 1));
        }
        persistDatabase();
      }
      return clone(siblings);
    },

    uploadLessonAttachment(payload) {
      const actor = assertApprovedTeacherOrAdminRLS();
      const lesson = _state.lessons.find(l => l.id === payload.lesson_id);
      if (!lesson) throw new Error('الدرس غير موجود لربط الملف المرفق.');
      const sub = _state.subjects.find(s => s.id === lesson.subject_id);
      const storageObj = global.BaccSupabaseConnector.storage.uploadFile({
        bucket: 'course-materials',
        stageId: sub ? sub.stage_id : 'grade_2',
        subjectId: lesson.subject_id,
        courseId: lesson.course_id || ('crs_' + lesson.subject_id),
        fileName: payload.file_name || lesson.pdf_title,
        mimeType: payload.file_type || 'application/pdf',
        contentText: payload.content_text || lesson.pdf_content,
        isProtected: !lesson.is_free_preview
      });
      const att = {
        id: 'att_' + Date.now() + '_' + Math.floor(Math.random() * 1000),
        lesson_id: lesson.id,
        course_id: lesson.course_id || ('crs_' + lesson.subject_id),
        stage_id: sub ? sub.stage_id : 'grade_2',
        subject_id: lesson.subject_id,
        file_name: storageObj.fileName,
        file_type: storageObj.mimeType,
        storage_bucket: 'course-materials',
        storage_path: storageObj.path,
        is_protected: storageObj.isProtected,
        uploaded_by: actor.id,
        created_at: new Date().toISOString().substring(0, 10)
      };
      _state.lesson_attachments.unshift(att);
      if (payload.content_text) lesson.pdf_content = payload.content_text;
      if (payload.file_name) lesson.pdf_title = payload.file_name;
      persistDatabase();
      logAudit('رفع ملف PDF إلى Supabase Storage (' + att.storage_path + ')', 'info');

    },

    getSignedAttachmentUrl(attachmentId) {
      const user = assertAuthenticatedRLS();
      const att = _state.lesson_attachments.find(a => a.id === attachmentId);
      if (!att) throw new Error('المرفق غير موجود.');
      if (att.is_protected && !hasSubjectAccess(att.subject_id)) {
        throw new Error('RLS_STORAGE_LOCKED: هذا الملف محمي ويتطلب اشتراكاً فعالاً في الكورس.');
      }
      return global.BaccSupabaseConnector.storage.createSignedUrl(att.storage_path, 3600, _session.token);

    // --- Subscriptions & Electronic Checkout ---
    getSubscriptionPlans() {
      return clone(_state.subscription_plans);
    },

    purchaseSubscription({ planId, subjectId, paymentMethod, phoneOrCardRef }) {
      const user = assertAuthenticatedRLS();
      const plan = _state.subscription_plans.find(p => p.id === planId);
      if (!plan) throw new Error('الباقة غير موجودة.');
      let amount = Number(plan.price_egp);
      if (planId === 'plan_subject' && subjectId) {
        const targetSubject = _state.subjects.find(s => s.id === subjectId);
        if (targetSubject && Number(targetSubject.price_egp) > 0) {
          amount = Number(targetSubject.price_egp);
        }
      }
      const txn = 'TXN-EG-' + Math.floor(100000 + Math.random() * 900000);
      const record = {
        id: 'subscr_' + Date.now(),
        student_id: user.id,
        plan_id: plan.id,
        subject_id: planId === 'plan_subject' ? subjectId : null,
        amount_egp: amount,
        payment_method: paymentMethod || 'بطاقة بنكية / ميزة',
        transaction_ref: txn + (phoneOrCardRef ? ' (' + String(phoneOrCardRef).slice(-4) + ')' : ''),
        status: 'active',
        started_at: new Date().toISOString().substring(0, 10),
        expires_at: '2027-08-31'
      };
      _state.subscriptions.unshift(record);
      const uRef = _state.users.find(u => u.id === user.id);
      if (uRef && (plan.id === 'plan_track' || plan.id === 'plan_vip')) {
        uRef.subscription_plan = plan.id;
      } else if (uRef && uRef.subscription_plan === 'plan_free') {
        uRef.subscription_plan = plan.id;
      }
      _state.notifications.unshift({
        id: 'notif_' + Date.now(),
        target_role: 'student',
        target_stage: uRef ? uRef.grade_id : 'all',
        title: 'تم تفعيل اشتراكك بنجاح (' + plan.name + ')',
        message: 'رقم العملية المرجعي: ' + txn + ' — تم فتح جميع الدروس والمذكرات والامتحانات المشمولة في الباقة.',
        type: 'success',
        created_at: new Date().toISOString().replace('T', ' ').substring(0, 16),
        read_by: []
      });
      persistDatabase();
      logAudit('تفعيل اشتراك جديد للطالب ' + user.email + ' بقيمة ' + amount + ' ج.م (' + txn + ')', 'info');
      return { ok: true, subscription: clone(record) };
    },

    // --- Search & Multi-Criterion Filtering (Phase 4) ---
    globalSearch(query, filters = {}) {
      const q = String(query || '').trim().toLowerCase();
      const stageFilter = filters.stage_id && filters.stage_id !== 'all' ? filters.stage_id : null;
      const subjectFilter = filters.subject_id && filters.subject_id !== 'all' ? filters.subject_id : null;
      const teacherFilter = filters.teacher_id && filters.teacher_id !== 'all' ? filters.teacher_id : null;

      let subjects = this.getSubjects();
      let courses = this.getCourses();
      let lessons = clone(_state.lessons).filter(l => l.review_status === 'approved' && l.is_published !== false);
      let teachers = this.getTeachers();
      let exams = this.getExams();

      if (stageFilter) {
        subjects = subjects.filter(s => s.stage_id === stageFilter);
        courses = courses.filter(c => c.stage_id === stageFilter);
        exams = exams.filter(e => e.stage_id === stageFilter);
      }
      if (subjectFilter) {
        subjects = subjects.filter(s => s.id === subjectFilter);
        courses = courses.filter(c => c.subject_id === subjectFilter);
        lessons = lessons.filter(l => l.subject_id === subjectFilter);
        exams = exams.filter(e => e.subject_id === subjectFilter);
      }
      if (teacherFilter) {
        subjects = subjects.filter(s => s.teacher_id === teacherFilter);
        courses = courses.filter(c => c.teacher_id === teacherFilter);
        teachers = teachers.filter(t => t.id === teacherFilter || t.user_id === teacherFilter);
      }

      if (q) {
        subjects = subjects.filter(
          s => s.name.toLowerCase().includes(q) || s.description.toLowerCase().includes(q) || (s.teacher_name || '').toLowerCase().includes(q)
        );
        courses = courses.filter(
          c => c.title.toLowerCase().includes(q) || c.description.toLowerCase().includes(q) || (c.teacher_name || '').toLowerCase().includes(q)
        );
        lessons = lessons.filter(
          l => l.title.toLowerCase().includes(q) || l.video_summary.toLowerCase().includes(q) || l.pdf_title.toLowerCase().includes(q)
        );
        teachers = teachers.filter(
          t => t.name.toLowerCase().includes(q) || t.subject_specialty.toLowerCase().includes(q) || t.bio.toLowerCase().includes(q)
        );
        exams = exams.filter(e => e.title.toLowerCase().includes(q) || e.exam_type.toLowerCase().includes(q));
      }

      lessons = lessons.map(l => {
        const sub = _state.subjects.find(s => s.id === l.subject_id);
        return { ...l, subject_name: sub ? sub.name : '' };
      });

      return { subjects, courses, lessons, teachers, exams };
    },

    getAnnouncements() {
      return clone(_state.announcements);
    },

    getNotifications() {
      const user = this.getCurrentUser();
      const userId = user ? user.id : 'guest';
      return clone(_state.notifications)
        .filter(n => {
          if (!user) return n.target_role === 'all';
          if (user.role === 'admin') return true;
          return (
            (n.target_role === 'all' || n.target_role === user.role) &&
            (n.target_stage === 'all' || n.target_stage === (user.stage_id || user.grade_id))
          );
        })
        .map(n => ({
          ...n,
          is_read: Array.isArray(n.read_by) && n.read_by.includes(userId)
        }));
    },

    markAllNotificationsRead() {
      const user = this.getCurrentUser();
      const userId = user ? user.id : 'guest';
      _state.notifications.forEach(n => {
        if (!Array.isArray(n.read_by)) n.read_by = [];
        if (!n.read_by.includes(userId)) n.read_by.push(userId);
      });
      persistDatabase();
      return true;
    },

    // ========================================================================
    // ADMIN-ONLY OPERATIONS (PROTECTED BY DATABASE RLS `assertAdminRLS()`)
    // ========================================================================
    adminGetCompleteDashboard() {
      assertAdminRLS();
      const students = _state.users.filter(u => u.role === 'student').map(sanitizeUserRecord);
      const teacherUsers = _state.users.filter(u => u.role === 'teacher').map(sanitizeUserRecord);

      const teachers = clone(_state.teachers);
      const totalRevenue = _state.subscriptions
        .filter(s => s.status === 'active')
        .reduce((acc, s) => acc + Number(s.amount_egp || 0), 0);

      const trackDistribution = _state.tracks.map(t => ({
        id: t.id,
        name: t.shortName || t.name,
        count: _state.users.filter(u => u.role === 'student' && u.track_id === t.id).length
      }));

      const stageDistribution = _state.stages.map(s => ({

      }));

      return {

          students_count: students.length,

        admins,
        teachers,
        all_users: _state.users.map(sanitizeUserRecord),
        stages: clone(_state.stages),
        tracks: clone(_state.tracks),
        subjects: this.getSubjects(),
        courses: clone(_state.courses),
        units: clone(_state.units).sort((a, b) => a.order_index - b.order_index),
        lessons: clone(_state.lessons).sort((a, b) => a.order_index - b.order_index),
        attachments: clone(_state.lesson_attachments),
        reviews: clone(_state.content_reviews),
        exams: clone(_state.exams),
        subscriptions: clone(_state.subscriptions).map(s => {
          const stu = _state.users.find(u => u.id === s.student_id);
          const pl = _state.subscription_plans.find(p => p.id === s.plan_id);

          };
        }),
        plans: clone(_state.subscription_plans),
        trackDistribution,

        vault: clone(_state.admin_only_vault)
      };
    },

    // Phase 3: Admin approves or rejects a Teacher account
    adminReviewTeacher(teacherUserId, decision, notes = '') {
      const admin = assertAdminRLS();
      const user = _state.users.find(u => u.id === teacherUserId && u.role === 'teacher');
      if (!user) throw new Error('حساب المدرس غير موجود.');
      user.approval_status = decision === 'approved' ? 'approved' : 'rejected';
      const tchCatalog = _state.teachers.find(t => t.id === user.teacher_ref_id || t.user_id === user.id);
      if (tchCatalog) {
        tchCatalog.approval_status = user.approval_status;
        tchCatalog.title =
          user.approval_status === 'approved'
            ? 'خبير ' + (user.specialty || 'مناهج البكالوريا') + ' معتمد'
            : 'معلم (مرفوض)';
      }
      _state.content_reviews.unshift({
        id: 'rev_' + Date.now(),
        target_type: 'teacher',
        target_id: user.id,
        target_title: user.full_name,
        reviewer_id: admin.id,
        decision: user.approval_status,
        notes: notes || (decision === 'approved' ? 'تم اعتماد المدرس ومنحه صلاحية نشر الدروس.' : 'تم رفض طلب حساب المدرس.'),
        reviewed_at: new Date().toISOString().replace('T', ' ').substring(0, 16)
      });
      persistDatabase();
      logAudit('مراجعة حساب المدرس ' + user.email + ' -> القرار: ' + user.approval_status, 'security');
      return sanitizeUserRecord(user);
    },

    // Phase 4: Admin approves, rejects, or hides a course or lesson
    adminReviewContent(targetType, targetId, decision, notes = '') {
      const admin = assertAdminRLS();
      let targetTitle = targetId;
      if (targetType === 'lesson') {
        const les = _state.lessons.find(l => l.id === targetId);
        if (!les) throw new Error('الدرس غير موجود.');
        les.review_status = decision; // approved | rejected | hidden
        les.is_published = decision === 'approved';
        targetTitle = les.title;
      } else if (targetType === 'course') {
        const crs = _state.courses.find(c => c.id === targetId);
        if (!crs) throw new Error('الكورس غير موجود.');
        crs.review_status = decision;
        crs.is_published = decision === 'approved';
        targetTitle = crs.title;
      }
      const reviewRecord = {
        id: 'rev_' + Date.now() + '_' + Math.floor(Math.random() * 1000),
        target_type: targetType,
        target_id: targetId,
        target_title: targetTitle,
        reviewer_id: admin.id,
        decision,
        notes: notes || ('تم تحديث حالة المراجعة إلى: ' + decision),
        reviewed_at: new Date().toISOString().replace('T', ' ').substring(0, 16)
      };
      _state.content_reviews.unshift(reviewRecord);
      persistDatabase();
      logAudit('مراجعة محتوى (' + targetType + ': ' + targetTitle + ') -> ' + decision, 'security');
      return clone(reviewRecord);
    },

    adminDeleteSubject(subjectId) {
      assertAdminRLS();
      _state.subjects = _state.subjects.filter(s => s.id !== subjectId);
      _state.courses = _state.courses.filter(c => c.subject_id !== subjectId);
      _state.units = _state.units.filter(u => u.subject_id !== subjectId);
      _state.lessons = _state.lessons.filter(l => l.subject_id !== subjectId);
      _state.exams = _state.exams.filter(e => e.subject_id !== subjectId);
      persistDatabase();
      logAudit('حذف مادة دراسية وملحقاتها: ' + subjectId, 'security');
      return true;
    },

    // Both Approved Teachers and Admins can create/update lessons
    adminUpsertLesson(payload) {
      const actor = assertApprovedTeacherOrAdminRLS();
      const subject = _state.subjects.find(s => s.id === payload.subject_id);
      if (!subject) throw new Error('يرجى اختيار المادة الدراسية أولاً.');
      let course = _state.courses.find(c => c.id === payload.course_id || c.subject_id === subject.id);
      let unit = _state.units.find(u => u.id === payload.unit_id && u.subject_id === subject.id);
      if (!unit) {
        unit = _state.units.find(u => u.subject_id === subject.id);
        if (!unit) {
          unit = {
            id: 'u_' + Date.now(),
            subject_id: subject.id,
            course_id: course ? course.id : null,
            title: payload.unit_title || 'الوحدة الأولى',
            order_index: 1
          };
          _state.units.push(unit);
        }
      }

      let les = _state.lessons.find(l => l.id === payload.id);
      if (les) {
        les.title = payload.title || les.title;
        les.subject_id = subject.id;
        les.unit_id = unit.id;
        les.course_id = course ? course.id : les.course_id;
        les.duration_minutes = Number(payload.duration_minutes || les.duration_minutes);
        les.video_url = payload.video_url || les.video_url;
        les.video_summary = payload.video_summary || les.video_summary;
        les.content = payload.content || les.video_summary;
        les.pdf_title = payload.pdf_title || les.pdf_title;
        les.pdf_content = payload.pdf_content || les.pdf_content;
        les.is_free_preview = payload.is_free_preview !== undefined ? !!payload.is_free_preview : les.is_free_preview;
        if (actor.role === 'admin' && payload.review_status) les.review_status = payload.review_status;
      } else {
        const initialStatus = payload.review_status || (actor.role === 'admin' ? 'approved' : (payload.require_review ? 'pending' : 'approved'));
        les = {
          id: 'les_' + Date.now() + '_' + Math.floor(Math.random() * 1000),
          unit_id: unit.id,
          course_id: course ? course.id : null,
          subject_id: subject.id,
          title: payload.title,
          content: payload.content || payload.video_summary || 'محتوى شرح الدرس التفاعلي.',
          duration_minutes: Number(payload.duration_minutes || 45),
          video_url: payload.video_url || 'https://www.youtube.com/embed/J9w-N3xS2sI',
          video_summary: payload.video_summary || 'شرح تفصيلي ووافٍ لجميع عناصر الدرس مع تطبيقات عملية وأسئلة التقييم الأسبوعي.',
          pdf_title: payload.pdf_title || (payload.title + ' - مذكرة الشرح.pdf'),
          pdf_content: payload.pdf_content || ('مذكرة الشرح والملخص لدرس: ' + payload.title + '\nتشمل القواعد الأساسية والتدريبات التطبيقية بنظام البكالوريا المصرية.'),
          is_free_preview: payload.is_free_preview !== undefined ? !!payload.is_free_preview : true,
          is_published: initialStatus === 'approved',
          review_status: initialStatus,
          created_by: actor.id,
          order_index: _state.lessons.filter(l => l.subject_id === subject.id).length + 1,
          quiz_questions: payload.quiz_questions || [
            {
              q: 'سؤال تطبيقي على ' + payload.title + ': هل يُعد هذا الدرس ضمن المقررات الأساسية المعتمدة؟',
              options: ['نعم، ضمن المنهج المعتمد', 'لا، قراءة خارجية فقط'],
              correct: 0,
              explanation: 'هذا الدرس جزء أساسي من المقررات المعتمدة في نظام البكالوريا المصرية.'
            }
          ]
        };
        _state.lessons.push(les);

        _state.notifications.unshift({
          id: 'notif_' + Date.now(),
          target_role: 'all',
          target_stage: subject.stage_id,
          title: 'درس جديد في ' + subject.name,
          message: 'تمت إضافة درس «' + les.title + '» مع فيديو الشرح ومذكرة الـ PDF والتدريب التفاعلي.',
          type: 'lesson',
          created_at: new Date().toISOString().replace('T', ' ').substring(0, 16),
          read_by: []
        });
      }
      persistDatabase();
      logAudit('إضافة/تحديث درس: ' + les.title + ' (' + subject.name + ') بواسطة ' + actor.email, 'info');
      return clone(les);
    },

    adminDeleteLesson(lessonId) {
      assertAdminRLS();
      _state.lessons = _state.lessons.filter(l => l.id !== lessonId);
      persistDatabase();
      logAudit('حذف درس: ' + lessonId, 'info');
      return true;
    },

    // Both Approved Teachers and Admins can create exams
    adminCreateExam(payload) {
      const actor = assertApprovedTeacherOrAdminRLS();
      const subject = _state.subjects.find(s => s.id === payload.subject_id);
      if (!subject) throw new Error('المادة غير موجودة.');
      const examId = 'ex_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
      const questionsList =
        payload.questions && payload.questions.length
          ? payload.questions
          : [
              {
                id: 'q1_' + Date.now(),
                type: 'mcq',
                text: payload.sample_q1_text || ('سؤال اختيار من متعدد في مادة ' + subject.name + ': ما الاختيار الأدق علمياً؟'),
                marks: 50,
                options: payload.sample_q1_options || ['الإجابة النموذجية الأولى (الصحيحة)', 'البديل الثاني', 'البديل الثالث', 'البديل الرابع'],
                correctAnswer: '0',
                explanation: 'الإجابة الأولى هي المطابقة لمعايير التقييم.'
              },
              {
                id: 'q2_' + Date.now(),
                type: 'tf',
                text: payload.sample_q2_text || ('تُحتسب للطالب الدرجة الأعلى عند دخول الفرصة الثانية التحسينية في مادة ' + subject.name + '.'),
                marks: 50,
                options: ['صواب', 'خطأ'],
                correctAnswer: '0',
                explanation: 'عبارة صحيحة وفق اللائحة التنفيذية لشهادة البكالوريا المصرية.'
              }
            ];

      const exam = {
        id: 'ex_' + Date.now(),
        subject_id: subject.id,
        course_id: payload.course_id || ('crs_' + subject.id),
        stage_id: subject.stage_id,
        title: payload.title,
        exam_type: payload.exam_type || 'اختبار تجريبي شامل - فرصة أولى',
        duration_minutes: Number(payload.duration_minutes || 45),
        total_marks: Number(payload.total_marks || 100),
        pass_marks: Number(payload.pass_marks || 50),
        is_premium: !!payload.is_premium,
        published_at: new Date().toISOString().substring(0, 10),
        created_by: actor.id,
        questions: questionsList
      };
      _state.exams.unshift(exam);
      questionsList.forEach((q, idx) => {
        _state.questions.push({
          id: examId + '_' + q.id,
          local_id: q.id,
          exam_id: 'ex_' + Date.now(),
          question_text: q.text,
          question_type: q.type || 'mcq',
          options: q.options || [],
          correct_answer: String(q.correctAnswer || '0'),
          marks: Number(q.marks || 50),
          explanation: q.explanation || '',
          order_index: idx + 1
        });
      });

      _state.notifications.unshift({
        id: 'notif_' + Date.now(),
        target_role: 'all',
        target_stage: subject.stage_id,
        title: 'امتحان إلكتروني جديد: ' + exam.title,
        message: 'تم طرح اختبار جديد في مادة ' + subject.name + ' مع التصحيح التلقائي الفوري.',
        type: 'exam',
        created_at: new Date().toISOString().replace('T', ' ').substring(0, 16),
        read_by: []
      });
      persistDatabase();
      logAudit('إنشاء امتحان إلكتروني جديد: ' + exam.title + ' بواسطة ' + actor.email, 'info');
      return clone(exam);
    },

    adminDeleteExam(examId) {
      assertAdminRLS();
      _state.exams = _state.exams.filter(e => e.id !== examId);
      _state.questions = _state.questions.filter(q => q.exam_id !== examId);
      persistDatabase();
      logAudit('حذف امتحان: ' + examId, 'info');
      return true;
    },

    adminUpdatePlanPrice(planId, newPriceEgp) {
      assertAdminRLS();
      const plan = _state.subscription_plans.find(p => p.id === planId);
      if (!plan) throw new Error('الباقة غير موجودة.');
      plan.price_egp = Number(newPriceEgp);
      persistDatabase();
      logAudit('تعديل سعر الباقة (' + plan.name + ') إلى ' + plan.price_egp + ' ج.م', 'info');
      return clone(plan);
    },

    adminGrantSubscription(studentId, planId, subjectId) {
      assertAdminRLS();
      const stu = _state.users.find(u => u.id === studentId);
      const plan = _state.subscription_plans.find(p => p.id === planId);
      if (!stu || !plan) throw new Error('الطالب أو الباقة غير موجودة.');
      const rec = {
        id: 'subscr_adm_' + Date.now(),
        student_id: stu.id,
        plan_id: plan.id,
        subject_id: subjectId || null,
        amount_egp: Number(plan.price_egp),
        payment_method: 'تفعيل إداري مباشر (Admin Grant)',
        transaction_ref: 'ADM-GRANT-' + Math.floor(10000 + Math.random() * 90000),
        status: 'active',
        started_at: new Date().toISOString().substring(0, 10),
        expires_at: '2027-08-31'
      };
      _state.subscriptions.unshift(rec);
      stu.subscription_plan = plan.id;
      persistDatabase();
      logAudit('منح اشتراك إداري للطالب ' + stu.email + ' في ' + plan.name, 'security');
      return clone(rec);
    },

    adminPostAnnouncement(payload) {
      assertAdminRLS();
      const ann = {
        id: 'ann_' + Date.now(),
        title: payload.title,
        category: payload.category || 'أخبار وإعلانات',
        content: payload.content,
        official_source_label: payload.official_source_label || 'إدارة Baccalaureate Academy',
        published_at: new Date().toISOString().substring(0, 10),
        is_pinned: !!payload.is_pinned
      };
      _state.announcements.unshift(ann);
      _state.notifications.unshift({
        id: 'notif_' + Date.now(),
        target_role: 'all',
        target_stage: 'all',
        title: 'خبر تعليمي جديد: ' + ann.title,
        message: ann.content.substring(0, 110) + '...',
        type: 'info',
        created_at: new Date().toISOString().replace('T', ' ').substring(0, 16),
        read_by: []
      });
      persistDatabase();
      logAudit('نشر إعلان تعليمي جديد: ' + ann.title, 'info');
      return clone(ann);
    },

    adminCreateBackup(label) {
      const admin = assertAdminRLS();
      const serialized = JSON.stringify(_state);
      const checksum = 'sha256:' + sha256Pure(utf8Encode(serialized)).substring(0, 16);
      const bkp = {
        id: 'bkp_' + Date.now(),
        label: label || ('نسخة احتياطية كاملة - ' + new Date().toISOString().replace('T', ' ').substring(0, 16)),
        created_by: admin.email,
        created_at: new Date().toISOString().replace('T', ' ').substring(0, 16),
        records_count:
          _state.users.length +
          _state.subjects.length +
          _state.courses.length +
          _state.lessons.length +
          _state.exams.length +
          _state.subscriptions.length,
        checksum
      };
      _state.admin_only_vault.backups.unshift(bkp);
      persistDatabase();
      logAudit('إنشاء نسخة احتياطية مشفرة لقاعدة البيانات (' + bkp.id + ')', 'security');
      return {
        backupMeta: clone(bkp),
        exportJsonString: JSON.stringify(
          {
            signature: 'BACCALAUREATE_ACADEMY_SIGNED_BACKUP_V4',
            checksum,
            exported_at: new Date().toISOString(),
            exported_by: admin.email,
            database: _state
          },
          null,
          2
        )
      };
    },

    adminRestoreFromJson(jsonString) {
      assertAdminRLS();
      let parsed;
      try {
        parsed = JSON.parse(jsonString);
      } catch (e) {
        throw new Error('ملف النسخة الاحتياطية غير صالح (JSON Syntax Error).');
      }
      const dbCandidate = parsed.database || parsed;
      if (!dbCandidate || !Array.isArray(dbCandidate.stages) || !Array.isArray(dbCandidate.subjects) || !Array.isArray(dbCandidate.users)) {
        throw new Error('هيكل ملف الاستعادة غير متوافق مع جداول Baccalaureate Academy.');
      }
      _state = dbCandidate;
      normalizeDatabaseTables(_state);
      persistDatabase();
      logAudit('استعادة قاعدة البيانات بالكامل من نسخة احتياطية معتمدة', 'security');
      return { ok: true };
    },

    adminResetToFactorySeed() {
      assertAdminRLS();
      _state = clone(global.BACC_INITIAL_SEED);
      normalizeDatabaseTables(_state);
      persistDatabase();
      logAudit('إعادة ضبط قاعدة البيانات إلى البيانات المرجعية الأصلية', 'security');
      return { ok: true };
    }
  };
})(window);

    return String(str === undefined || str === null ? '' : str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function showToast(message, type = 'success') {
    const container = document.getElementById('bacc-toast-container');
    if (!container) return;
    const colors = {
      success: 'bg-teal-800 border-teal-500 text-white',
      error: 'bg-red-800 border-red-500 text-white',
      warning: 'bg-amber-700 border-amber-400 text-white',
      info: 'bg-slate-900 border-teal-400 text-white'
    };
    const toast = document.createElement('div');
    toast.className =
      'flex items-center justify-between gap-3 px-4 py-3 rounded-xl shadow-xl border-r-4 text-sm font-bold transition-all duration-300 ' +
      (colors[type] || colors.info);
    toast.innerHTML =
      '<span>' +
      escapeHtml(message) +
      '</span><button type="button" class="text-white/80 hover:text-white font-black px-1" onclick="this.parentElement.remove()">✕</button>';
    container.appendChild(toast);
    setTimeout(() => {
      if (toast && toast.parentElement) toast.remove();
    }, 4500);
  }

  function clearTimers() {
    if (AppState.studioInterval) {
      clearInterval(AppState.studioInterval);
      AppState.studioInterval = null;

    const s = Math.max(0, Math.floor(sec));

    const rem = s % 60;

    const tracks = global.BaccDB.getTracks();
    const subjects = global.BaccDB.getSubjects({
      stage_id: stage.id,
      track_id: AppState.selectedTrackFilter
    });

    return `
      <div class="max-w-7xl mx-auto px-4 sm:px-6 py-8 space-y-6">

          <div class="flex flex-wrap items-center gap-2">
            ${stages
              .map(
                s => `
              <button type="button" onclick="BaccApp.openStage('${s.id}')" class="px-4 py-2.5 rounded-xl text-xs sm:text-sm font-extrabold transition ${
                  s.id === stage.id
                    ? 'bg-slate-900 text-amber-400 shadow'
                    : 'bg-slate-100 hover:bg-slate-200 text-slate-700'
                }">
                ${escapeHtml(s.name)}
              </button>
            `
              )
              .join('')}
          </div>
          <span class="text-xs font-bold text-teal-800 bg-teal-50 px-3 py-1.5 rounded-xl border border-teal-200">
            ${escapeHtml(stage.system_type)}
          </span>

        <div class="bacc-hero-gradient text-white rounded-3xl p-6 sm:p-8 shadow-lg">

              <span class="bg-amber-500/20 text-amber-300 border border-amber-400/30 text-xs font-extrabold px-3 py-1 rounded-full">${escapeHtml(stage.badge)}</span>
              <h1 class="text-2xl sm:text-3xl font-black">${escapeHtml(stage.name)} — ${escapeHtml(stage.subtitle)}</h1>
              <p class="text-xs sm:text-sm text-slate-200 leading-relaxed">${escapeHtml(stage.description)}</p>
            </div>
            <div class="bg-white/10 backdrop-blur rounded-2xl p-4 border border-white/15 min-w-[210px] text-center">
              <div class="text-xs text-slate-300">إجمالي الدرجات المقررة بالمرحلة</div>
              <div class="text-3xl font-black text-amber-400 my-1">${stage.max_score} درجة</div>

            </div>
          </div>
        </div>

        ${
          stage.id !== 'grade_1'
            ? `
          <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm space-y-2">
            <div class="text-xs font-bold text-slate-500">تصفية المواد الدراسية حسب المسار التخصصي بالبكالوريا المصرية:</div>
            <div class="flex flex-wrap gap-2">
              <button type="button" onclick="BaccApp.setTrackFilter('all')" class="px-3.5 py-2 rounded-xl text-xs font-extrabold transition ${

                  ? 'bg-teal-700 text-white shadow'

              ${tracks
                .map(
                  t => `
                <button type="button" onclick="BaccApp.setTrackFilter('${t.id}')" class="px-3.5 py-2 rounded-xl text-xs font-extrabold transition ${
                    AppState.selectedTrackFilter === t.id
                      ? 'bg-teal-700 text-white shadow'
                      : 'bg-slate-100 hover:bg-slate-200 text-slate-700'
                  }">
                  ${escapeHtml(t.name)}
                </button>
              `
                )
                .join('')}
            </div>
          </div>

            : ''

              const badgeClass =

                  : 'bg-amber-100 text-amber-900 border-amber-300';

                    <div>
                      <span class="font-black text-slate-900 block">${sub.units_count}</span>
                      <span class="text-[10px] text-slate-500">وحدات</span>

                    !sub.is_unlocked
                      ? `<button type="button" onclick="BaccApp.startSubjectCheckout('${sub.id}')" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold px-3.5 py-2.5 rounded-xl text-xs transition">

    const allLessons = details.all_lessons || [];
    let activeLesson = allLessons.find(l => l.id === AppState.selectedLessonId) || allLessons[0] || null;
    if (activeLesson && AppState.selectedLessonId !== activeLesson.id) {
      AppState.selectedLessonId = activeLesson.id;
    }

    return `

        <div class="bg-white rounded-3xl p-6 border border-slate-200 shadow-sm">

              <div class="flex items-center gap-2 text-xs text-slate-500">
                <button type="button" onclick="BaccApp.openStage('${details.stage_id}')" class="hover:text-teal-700 font-bold">
                  ${escapeHtml(details.stage ? details.stage.name : 'المرحلة الدراسية')}
                </button>
                <span>/</span>
                <span class="text-teal-700 font-bold">${escapeHtml(details.category)}</span>
              </div>
              <h1 class="text-xl sm:text-2xl font-black text-slate-900">${escapeHtml(details.name)}</h1>
              <p class="text-xs text-slate-600 max-w-2xl">${escapeHtml(details.description)}</p>

                        return `

                            ? 'bg-teal-700 text-white border-teal-700 shadow-sm'

          <div class="lg:col-span-8 space-y-5">

                  <div class="bg-white rounded-3xl p-8 text-center border border-amber-300 shadow-sm space-y-4">

                    </p>
                    <div class="flex justify-center gap-3 pt-2">
                      <button type="button" onclick="BaccApp.startSubjectCheckout('${details.id}')" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-black px-6 py-3 rounded-xl text-sm shadow">

              <button type="button" onclick="BaccApp.generateLessonSignedUrl('${lesson.id}')" class="bg-slate-900 hover:bg-slate-800 text-amber-400 font-bold px-3 py-1.5 rounded-xl text-xs">

          <div class="bg-teal-900 text-white p-4 rounded-2xl flex items-center justify-between">

              <h4 class="font-black text-sm">🧠 تدريب تفاعلي فوري بعد الدرس</h4>

              : questions
                  .map((qObj, qIdx) => {
                    const selected = AppState.quizAnswers[qIdx];
                    return `
                    <div class="bg-slate-50 rounded-2xl p-4 border border-slate-200 space-y-3">
                      <div class="font-bold text-sm text-slate-900">${qIdx + 1}. ${escapeHtml(qObj.q)}</div>
                      <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">

                          .map((opt, optIdx) => {
                            const isPicked = String(selected) === String(optIdx);
                            let btnStyle = isPicked
                              ? 'bg-teal-700 text-white border-teal-700'
                              : 'bg-white hover:bg-teal-50 text-slate-800 border-slate-200';
                            if (AppState.quizSubmitted) {
                              if (optIdx === qObj.correct) {
                                btnStyle = 'bg-emerald-600 text-white border-emerald-600';
                              } else if (isPicked && optIdx !== qObj.correct) {
                                btnStyle = 'bg-red-600 text-white border-red-600';
                              }
                            }

                </div>
              `
                  )
                  .join('')

    return `

            <div class="flex items-center gap-2">
